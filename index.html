<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wash Lover Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 🎨 Global Styles & Custom Scrollbar */
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #f8fafc 100%);
            transition: background 0.4s ease, color 0.4s ease;
            min-height: 100vh;
        }
        body.dark {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        body.dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 🧊 Card Design */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px; /* ลดความโค้งนิดนึงให้เหมาะกับมือถือ */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            transition: all 0.3s ease;
        }
        @media (min-width: 768px) { .card { border-radius: 24px; } }
        
        body.dark .card {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        
        /* 🚀 Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        
        /* 🌟 Dark Mode specific */
        body.dark .text-slate-800 { color: #f8fafc; }
        body.dark .text-slate-700 { color: #e2e8f0; }
        body.dark .text-slate-500 { color: #94a3b8; }
        body.dark .border-b { border-color: rgba(255, 255, 255, 0.05); }
        body.dark tr:hover { background-color: rgba(255, 255, 255, 0.03) !important; }
        
        /* 🌀 Loading Screen */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        body.dark #loading-overlay { background: rgba(15, 23, 42, 0.85); }
        .spinner-logo { width: 70px; animation: popSpin 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        @media (min-width: 768px) { .spinner-logo { width: 90px; } }

        @keyframes popSpin {
            0% { transform: rotate(0deg) scale(0.9); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(0.9); }
        }
    </style>
</head>

    <!-- Script ควบคุม -->
    <script>
        const DB_API_URL = 'https://api.all123th.com/inw/api/wl_transactions/';
        const BRANCH_API_URL = 'https://washing.adokub.com/api/branch';
        let doughnutChartInstance = null;
        let barChartInstance = null;
        let lineChartInstance = null;
        let cacheData = {
            washer: 0, dryer: 0, deviceLabels: [], deviceTotals: [],
            washerHourly: Array(24).fill(0), dryerHourly: Array(24).fill(0)
        };

        async function loadBranches() {
            try {
                const res = await fetch(BRANCH_API_URL);
                const branches = await res.json();
                const branchSelect = document.getElementById('branchFilter');
                branchSelect.innerHTML = '';
                branches.forEach(b => {
                    const option = document.createElement('option');
                    option.value = b.serial;
                    option.textContent = b.name;
                    branchSelect.appendChild(option);
                });
                branchSelect.value = 'ladkabung';
            } catch (error) {
                document.getElementById('branchFilter').innerHTML = `<option value="all">รวมทุกสาขา</option><option value="ladkabung" selected>ลาดกระบัง</option>`;
            }
        }

        async function fetchData() {
            const loader = document.getElementById('loading-overlay');
            loader.style.display = 'flex'; loader.style.opacity = '1';
            try {
                // แก้ Syntax error ตรงนี้ให้ถูกต้อง
                const res = await fetch(`${DB_API_URL}?limit=2000`);
                let rawTransactions = await res.json();
                const dates = getDateRange();
                const targetStart = dates.start + " 00:00:00";
                const targetEnd = dates.end + " 23:59:59";
                const selectedBranch = document.getElementById('branchFilter').value;
                let filteredTransactions = rawTransactions.filter(t => {
                    if (!t.timestamp) return false;
                    const isDateMatch = t.timestamp >= targetStart && t.timestamp <= targetEnd;
                    const isBranchMatch = selectedBranch === 'all' || t.branch === selectedBranch;
                    return isDateMatch && isBranchMatch;
                });
                processDataAndRender(filteredTransactions);
            } catch (err) {
                console.error("API Error:", err);
            } finally {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }
        }

        async function silentFetchData() {
            try {
                const res = await fetch(`${DB_API_URL}?limit=2000`);
                let rawTransactions = await res.json();
                const dates = getDateRange();
                const targetStart = dates.start + " 00:00:00";
                const targetEnd = dates.end + " 23:59:59";
                const selectedBranch = document.getElementById('branchFilter').value;
                let filteredTransactions = rawTransactions.filter(t => {
                    if (!t.timestamp) return false;
                    return (t.timestamp >= targetStart && t.timestamp <= targetEnd) && (selectedBranch === 'all' || t.branch === selectedBranch);
                });
                processDataAndRender(filteredTransactions);
            } catch (err) {}
        }

        function processDataAndRender(transactions) {
            let totalIncome = 0;
            let totalJobs = transactions.length;
            let washerCount = 0;
            let dryerCount = 0;
            const deviceIncomeMap = {};
            const washerHourly = Array(24).fill(0);
            const dryerHourly = Array(24).fill(0);
            
            const tableHtml = transactions.length ? transactions.map((t) => {
                const coins = parseInt(t.coins_paid) || 0;
                const incomeBaht = coins * 10;
                totalIncome += incomeBaht;
                const isDryer = t.machine_type === 'Dryer' || t.device_name.includes('อบ');
                if (isDryer) dryerCount++; else washerCount++;
                if (incomeBaht > 0) deviceIncomeMap[t.device_name] = (deviceIncomeMap[t.device_name] || 0) + incomeBaht;

                const hour = parseInt(t.timestamp.substring(11, 13));
                if (!isNaN(hour) && hour >= 0 && hour < 24) {
                    if (isDryer) dryerHourly[hour] += incomeBaht; else washerHourly[hour] += incomeBaht;
                }
                
                const badgeClass = isDryer
                    ? 'bg-gradient-to-r from-orange-400 to-pink-500 text-white shadow-sm shadow-orange-500/20'
                    : 'bg-gradient-to-r from-sky-400 to-blue-500 text-white shadow-sm shadow-blue-500/20';
                
                // 🛠️ หัวใจสำคัญ: ใส่ whitespace-nowrap ในทุก <td> และ <span> เพื่อไม่ให้ข้อความขาดครึ่งในมือถือ
                return `
                    <tr class="text-xs sm:text-sm hover:bg-slate-50 transition-colors duration-200">
                        <td class="py-2.5 px-4 text-slate-500 font-medium whitespace-nowrap">${t.timestamp.substring(0, 16)}</td>
                        <td class="py-2.5 px-2 font-bold whitespace-nowrap ${isDryer ? 'text-orange-500 dark:text-orange-400' : 'text-sky-500 dark:text-sky-400'}">${t.device_name}</td>
                        <td class="py-2.5 px-2 text-center whitespace-nowrap"><span class="${badgeClass} px-2.5 py-1 rounded-full text-[10px] sm:text-xs font-semibold tracking-wide whitespace-nowrap">${isDryer ? 'อบผ้า' : 'ซักผ้า'}</span></td>
                        <td class="py-2.5 px-4 text-right font-bold text-slate-700 text-sm sm:text-base whitespace-nowrap">+${incomeBaht} <span class="text-[10px] sm:text-xs text-slate-400">฿</span></td>
                    </tr>`;
            }).join('') : `<tr><td colspan="4" class="text-center py-12 text-slate-400">
                <span class="block text-4xl mb-3 opacity-50">🔍</span>
                <p class="font-medium text-sm md:text-lg">ไม่พบข้อมูลในช่วงเวลานี้</p>
            </td></tr>`;
            
            document.getElementById('statCoins').innerText = totalIncome.toLocaleString() + ' ฿';
            document.getElementById('statJobs').innerText = totalJobs.toLocaleString();
            document.getElementById('statWasher').innerText = washerCount.toLocaleString();
            document.getElementById('statDryer').innerText = dryerCount.toLocaleString();
            document.getElementById('tableBody').innerHTML = tableHtml;
            
            const sortedDevices = Object.entries(deviceIncomeMap)
                .map(([name, total]) => ({ name, total }))
                .sort((a, b) => {
                    const isAWasher = a.name.includes('ซัก');
                    const isBWasher = b.name.includes('ซัก');
                    if (isAWasher && !isBWasher) return -1;
                    if (!isAWasher && isBWasher) return 1;
                    return parseInt(a.name.match(/\d+$/)?.[0] || 0) - parseInt(b.name.match(/\d+$/)?.[0] || 0);
                });
            cacheData.washer = washerCount; cacheData.dryer = dryerCount;
            cacheData.deviceLabels = sortedDevices.map(d => d.name);
            cacheData.deviceTotals = sortedDevices.map(d => d.total);
            cacheData.washerHourly = washerHourly; cacheData.dryerHourly = dryerHourly;
            
            updateCharts();
        }

        function checkFilter() {
            const isCustom = document.getElementById('timeFilter').value === 'custom';
            const wrapper = document.getElementById('customDateWrapper');
            wrapper.classList.toggle('hidden', !isCustom);
            wrapper.classList.toggle('flex', isCustom);
            document.getElementById('btnSearchCustom').classList.toggle('hidden', !isCustom);
            if (!isCustom) fetchData();
        }

        function formatThaiDateShort(dateStr) {
            if (!dateStr) return "-";
            const parts = dateStr.split('-');
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${parseInt(parts[2])} ${months[parseInt(parts[1]) - 1]} ${parseInt(parts[0]) + 543}`;
        }

        function getDateRange() {
            const f = document.getElementById('timeFilter').value;
            let startStr = "", endStr = "";
            const formatDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            if (f === 'custom') {
                startStr = document.getElementById('customDateStart').value;
                endStr = document.getElementById('customDateEnd').value;
            } else {
                const t = new Date(), s = new Date();
                if (f === 'weekly') s.setDate(t.getDate() - 7);
                if (f === 'monthly') s.setDate(t.getDate() - 30);
                startStr = formatDate(s); endStr = formatDate(t);
            }
            const displayEl = document.getElementById('dateRangeDisplay');
            if (displayEl) displayEl.innerText = startStr === endStr ? `📅 วันที่: ${formatThaiDateShort(startStr)}` : `📅 วันที่: ${formatThaiDateShort(startStr)} - ${formatThaiDateShort(endStr)}`;
            return { start: startStr, end: endStr };
        }

        Chart.defaults.font.family = "'Kanit', sans-serif";

        function updateCharts() {
            const isDark = document.body.classList.contains('dark');
            const textColor = isDark ? '#cbd5e1' : '#475569';
            const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
            
            // Adjust chart fonts based on screen size
            const isMobile = window.innerWidth < 768;
            const chartFontSize = isMobile ? 10 : 12;

            if (doughnutChartInstance) doughnutChartInstance.destroy();
            doughnutChartInstance = new Chart(document.getElementById('doughnutChart').getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: ['เครื่องซัก', 'เครื่องอบ'],
                    datasets: [{
                        data: [cacheData.washer, cacheData.dryer],
                        backgroundColor: ['#0ea5e9', '#f97316'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: { responsive: true, cutout: '70%', plugins: { legend: { position: 'bottom', labels: { color: textColor, padding: 15, usePointStyle: true, font: { size: chartFontSize } } } } }
            });

            if (lineChartInstance) lineChartInstance.destroy();
            const ctxLine = document.getElementById('peakHoursLineChart').getContext('2d');
            let gradW = ctxLine.createLinearGradient(0, 0, 0, 350); gradW.addColorStop(0, 'rgba(14, 165, 233, 0.4)'); gradW.addColorStop(1, 'rgba(14, 165, 233, 0)');
            let gradD = ctxLine.createLinearGradient(0, 0, 0, 350); gradD.addColorStop(0, 'rgba(249, 115, 22, 0.4)'); gradD.addColorStop(1, 'rgba(249, 115, 22, 0)');
            
            lineChartInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0') + ':00'),
                    datasets: [
                        { label: 'ซักผ้า', data: cacheData.washerHourly, borderColor: '#0ea5e9', backgroundColor: gradW, fill: true, tension: 0.4, borderWidth: isMobile ? 2 : 3, pointRadius: 0, pointHoverRadius: 6 },
                        { label: 'อบผ้า', data: cacheData.dryerHourly, borderColor: '#f97316', backgroundColor: gradD, fill: true, tension: 0.4, borderWidth: isMobile ? 2 : 3, pointRadius: 0, pointHoverRadius: 6 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { position: 'top', align: 'end', labels: { color: textColor, usePointStyle: true, boxWidth: 6, font: { size: chartFontSize } } } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: textColor, maxRotation: 45, font: { size: chartFontSize } } },
                        y: { grid: { color: gridColor, borderDash: [5, 5] }, ticks: { color: textColor, font: { size: chartFontSize } }, beginAtZero: true }
                    }
                }
            });

            if (barChartInstance) barChartInstance.destroy();
            barChartInstance = new Chart(document.getElementById('horizontalBarChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: cacheData.deviceLabels,
                    datasets: [{
                        data: cacheData.deviceTotals,
                        backgroundColor: cacheData.deviceLabels.map(l => l.includes('ซัก') ? '#0ea5e9' : '#f97316'),
                        borderRadius: 4,
                        barThickness: isMobile ? 12 : 16
                    }]
                },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: gridColor, borderDash: [5, 5] }, ticks: { color: textColor, font: { size: chartFontSize } } },
                        y: { grid: { display: false }, ticks: { color: textColor, font: {weight: 'bold', size: chartFontSize} } }
                    }
                }
            });
        }

        async function initDashboard() {
            await loadBranches();
            await fetchData();    
        }
        initDashboard();
        
        // แก้ไข syntax error ของ setInterval ตรงนี้
        setInterval(silentFetchData, 5 * 60 * 1000);
        
        function toggleDarkMode() {
            document.body.classList.toggle('dark');
            document.getElementById('theme-toggle-btn').innerText = document.body.classList.contains('dark') ? '☀️' : '🌙';
            updateCharts();
        }

        // ทำให้กราฟ Resize อัตโนมัติเวลาหมุนจอ
        window.addEventListener('resize', () => {
            if (doughnutChartInstance && lineChartInstance && barChartInstance) {
                updateCharts();
            }
        });
    </script>
</body>
</html>
