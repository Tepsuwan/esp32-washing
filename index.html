<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wash Lover Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #F8FAFC;
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background-color: #0f172a;
            color: #f1f5f9;
        }

        body.dark .card {
            background: #1e293b;
            border: 1px solid #334155;
        }

        body.dark .text-slate-800 {
            color: #f8fafc;
        }

        body.dark .text-slate-700 {
            color: #cbd5e1;
        }

        body.dark .text-slate-500 {
            color: #94a3b8;
        }

        body.dark .bg-slate-100 {
            background: #334155;
            color: #f8fafc;
        }

        body.dark .bg-white {
            background: #1e293b;
        }

        body.dark .border-b {
            border-color: #334155;
        }

        body.dark tr:hover {
            background-color: #334155 !important;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        body.dark #loading-overlay {
            background: rgba(15, 23, 42, 0.9);
        }

        .spinner-logo {
            width: 80px;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(180deg) scale(1.2);
            }

            100% {
                transform: rotate(360deg) scale(1);
            }
        }
    </style>
</head>

<body class="p-4 md:p-8">

    <!-- Loading Overlay -->
    <div id="loading-overlay">

                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

        <!-- Transaction Table Full Width -->

            <h2 class="text-lg font-bold mb-4 text-slate-700">ประวัติการทำงานล่าสุด</h2>
            <table class="w-full text-left relative">
                <thead class="sticky top-0 bg-white dark:bg-[#1e293b] z-10">
                    <tr class="text-slate-400 border-b">
                        <th class="pb-3">วันที่ / เวลา</th>
                        <th class="pb-3">อุปกรณ์</th>
                        <th class="pb-3">ประเภท</th>

    <script>
        // ใช้ API ฐานข้อมูลหลัก (โหลดเร็วปรี๊ด ⚡)
        const DB_API_URL = 'https://api.all123th.com/inw/api/wl_transactions/';
        // API สำหรับดึงรายชื่อสาขา
        const BRANCH_API_URL = 'https://washing.adokub.com/api/branch';

        let doughnutChartInstance = null;
        let barChartInstance = null;
        let lineChartInstance = null;

        let cacheData = {
            washer: 0,
            dryer: 0,
            deviceLabels: [],
            deviceTotals: [],
            washerHourly: Array(24).fill(0),
            dryerHourly: Array(24).fill(0)
        };

        // 🌟 1. ฟังก์ชันโหลดสาขาจาก API ตอนเปิดเว็บครั้งแรก
        async function loadBranches() {
            try {
                const res = await fetch(BRANCH_API_URL);
                const branches = await res.json();
                const branchSelect = document.getElementById('branchFilter');

                // ล้างค่าเก่าทิ้ง
                branchSelect.innerHTML = '<option value="all">รวมทุกสาขา</option>';

                // วนลูปเอาสาขามาใส่
                branches.forEach(b => {
                    const option = document.createElement('option');
                    option.value = b.serial; // เก็บค่า serial ไว้ใช้ค้นหา
                    option.textContent = b.name; // แสดงชื่อภาษาไทย
                    branchSelect.appendChild(option);
                });

                // บังคับเลือก Default เป็น "ladkabung"
                branchSelect.value = 'ladkabung';

            } catch (error) {
                console.error("โหลดรายชื่อสาขาไม่สำเร็จ:", error);
                // Fallback เผื่อ API สาขาล่ม อย่างน้อยก็ยังมีลาดกระบังให้กด
                document.getElementById('branchFilter').innerHTML = `
                    <option value="all">รวมทุกสาขา</option>
                    <option value="ladkabung" selected>ลาดกระบัง</option>
                `;
            }
        }

        // 🌟 2. ฟังก์ชันดึงข้อมูล (แบบมี Loading)
        async function fetchData() {
            const loader = document.getElementById('loading-overlay');
            loader.style.display = 'flex'; loader.style.opacity = '1';
            try {
                // ดึงข้อมูล 2000 แถวจาก Database
                const res = await fetch(`${DB_API_URL}?limit=2000`);
                let rawTransactions = await res.json();

                // ดึงวันที่ และ สาขาที่เลือกปัจจุบัน
                const dates = getDateRange();
                const targetStart = dates.start + " 00:00:00";
                const targetEnd = dates.end + " 23:59:59";
                const selectedBranch = document.getElementById('branchFilter').value;

                // ใช้ JS กรอง (วันที่ + สาขา)
                let filteredTransactions = rawTransactions.filter(t => {
                    if (!t.timestamp) return false;
                    const isDateMatch = t.timestamp >= targetStart && t.timestamp <= targetEnd;
                    const isBranchMatch = selectedBranch === 'all' || t.branch === selectedBranch;
                    return isDateMatch && isBranchMatch;
                });

                processDataAndRender(filteredTransactions);
            } catch (err) {
                console.error("API Fetch Error:", err);
            } finally {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }
        }

        // ฟังก์ชันดึงข้อมูลเบื้องหลังทุก 5 นาที (ไม่แสดง Loading)
        async function silentFetchData() {
            try {
                const res = await fetch(`${DB_API_URL}?limit=2000`);
                let rawTransactions = await res.json();

                const dates = getDateRange();
                const targetStart = dates.start + " 00:00:00";
                const targetEnd = dates.end + " 23:59:59";
                const selectedBranch = document.getElementById('branchFilter').value;

                let filteredTransactions = rawTransactions.filter(t => {
                    if (!t.timestamp) return false;
                    const isDateMatch = t.timestamp >= targetStart && t.timestamp <= targetEnd;
                    const isBranchMatch = selectedBranch === 'all' || t.branch === selectedBranch;
                    return isDateMatch && isBranchMatch;
                });

                processDataAndRender(filteredTransactions);
            } catch (err) {
                console.error("Silent API Fetch Error:", err);
            }
        }

        // ฟังก์ชันคำนวณและแสดงผลกราฟ
        function processDataAndRender(transactions) {
            let totalIncome = 0;
            let totalJobs = transactions.length;
            let washerCount = 0;
            let dryerCount = 0;

            const deviceIncomeMap = {};
            const washerHourly = Array(24).fill(0);
            const dryerHourly = Array(24).fill(0);

            const tableHtml = transactions.length ? transactions.map(t => {
                const coins = parseInt(t.coins_paid) || 0;
                const incomeBaht = coins * 10;
                totalIncome += incomeBaht;

                const isDryer = t.machine_type === 'Dryer' || t.device_name.includes('อบ');
                if (isDryer) {
                    dryerCount++;
                } else {
                    washerCount++;
                }

                if (incomeBaht > 0) {
                    deviceIncomeMap[t.device_name] = (deviceIncomeMap[t.device_name] || 0) + incomeBaht;
                }

                const hour = parseInt(t.timestamp.substring(11, 13));
                if (!isNaN(hour) && hour >= 0 && hour < 24) {
                    if (isDryer) {
                        dryerHourly[hour] += incomeBaht;
                    } else {
                        washerHourly[hour] += incomeBaht;
                    }
                }

                return `
                    <tr class="border-b text-sm hover:bg-slate-50 transition">
                        <td class="py-3 text-slate-500">${t.timestamp.substring(0, 16)}</td>
                        <td class="py-3 font-medium ${isDryer ? 'text-orange-600 dark:text-orange-400' : 'text-sky-600 dark:text-sky-400'}">${t.device_name}</td>
                        <td class="py-3"><span class="bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 px-2 py-1 rounded-full text-xs">${isDryer ? 'เครื่องอบ' : 'เครื่องซัก'}</span></td>
                        <td class="py-3 text-right font-bold text-pink-500">+${incomeBaht}</td>
                    </tr>`;
            }).join('') : `<tr><td colspan="4" class="text-center py-8 text-slate-400">
                <span class="block text-2xl mb-2">🔍</span> 
                ไม่พบข้อมูลในช่วงเวลานี้<br><span class="text-xs text-pink-400">(แนะนำ: เลือก "ระบุวันที่" แล้วลองเลือก ปี 2026 ดูครับ)</span>
            </td></tr>`;

            document.getElementById('statCoins').innerText = totalIncome.toLocaleString() + ' ฿';
            document.getElementById('statJobs').innerText = totalJobs.toLocaleString() + ' ครั้ง';
            document.getElementById('statWasher').innerText = washerCount.toLocaleString() + ' ครั้ง';
            document.getElementById('statDryer').innerText = dryerCount.toLocaleString() + ' ครั้ง';
            document.getElementById('tableBody').innerHTML = tableHtml;

            const sortedDevices = Object.entries(deviceIncomeMap)
                .map(([name, total]) => ({ name, total }))
                .sort((a, b) => {
                    const isAWasher = a.name.includes('ซัก');
                    const isBWasher = b.name.includes('ซัก');
                    if (isAWasher && !isBWasher) return -1;
                    if (!isAWasher && isBWasher) return 1;
                    return parseInt(a.name.match(/\d+$/)?.[0] || 0) - parseInt(b.name.match(/\d+$/)?.[0] || 0);
                });

            cacheData.washer = washerCount;
            cacheData.dryer = dryerCount;
            cacheData.deviceLabels = sortedDevices.map(d => d.name);
            cacheData.deviceTotals = sortedDevices.map(d => d.total);
            cacheData.washerHourly = washerHourly;
            cacheData.dryerHourly = dryerHourly;

            updateCharts();
        }

        // จัดการซ่อน/โชว์ช่องเลือกวันที่
        function checkFilter() {
            const isCustom = document.getElementById('timeFilter').value === 'custom';
            const wrapper = document.getElementById('customDateWrapper');

            wrapper.classList.toggle('hidden', !isCustom);
            wrapper.classList.toggle('flex', isCustom);
            document.getElementById('btnSearchCustom').classList.toggle('hidden', !isCustom);

            if (!isCustom) fetchData();
        }

        // จัดการตัวหนังสือวันที่ (ภาษาไทย)
        function formatThaiDateShort(dateStr) {
            if (!dateStr) return "-";
            const parts = dateStr.split('-');
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            const day = parseInt(parts[2]);
            const month = months[parseInt(parts[1]) - 1];
            const year = parseInt(parts[0]) + 543;
            return `${day} ${month} ${year}`;
        }

        function getDateRange() {
            const f = document.getElementById('timeFilter').value;
            let startStr = "", endStr = "";

            const formatDate = (d) => {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            if (f === 'custom') {
                startStr = document.getElementById('customDateStart').value;
                endStr = document.getElementById('customDateEnd').value;
            } else {
                const t = new Date();
                const s = new Date();
                if (f === 'weekly') s.setDate(t.getDate() - 7);
                if (f === 'monthly') s.setDate(t.getDate() - 30);
                startStr = formatDate(s);
                endStr = formatDate(t);
            }

            const dateStartThai = formatThaiDateShort(startStr);
            const dateEndThai = formatThaiDateShort(endStr);

            const displayEl = document.getElementById('dateRangeDisplay');
            if (displayEl) {
                if (startStr === endStr) {
                    displayEl.innerText = `📅 วันที่: ${dateStartThai}`;
                } else {
                    displayEl.innerText = `📅 วันที่: ${dateStartThai} ถึง ${dateEndThai}`;
                }
            }

            return { start: startStr, end: endStr };
        }

        // วาดกราฟ
        function updateCharts() {
            const isDark = document.body.classList.contains('dark');
            const textColor = isDark ? '#f1f5f9' : '#334155';
            const gridColor = isDark ? '#334155' : '#e2e8f0';

            if (doughnutChartInstance) doughnutChartInstance.destroy();
            doughnutChartInstance = new Chart(document.getElementById('doughnutChart').getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: ['เครื่องซัก', 'เครื่องอบ'],
                    datasets: [{ data: [cacheData.washer, cacheData.dryer], backgroundColor: ['#38bdf8', '#fb923c'] }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: textColor, font: { family: 'Kanit' } } } }
                }
            });

            if (lineChartInstance) lineChartInstance.destroy();
            const ctxLine = document.getElementById('peakHoursLineChart').getContext('2d');

            let gradWasher = ctxLine.createLinearGradient(0, 0, 0, 300);
            gradWasher.addColorStop(0, 'rgba(56, 189, 248, 0.25)');
            gradWasher.addColorStop(1, 'rgba(56, 189, 248, 0.0)');

            let gradDryer = ctxLine.createLinearGradient(0, 0, 0, 300);
            gradDryer.addColorStop(0, 'rgba(251, 146, 60, 0.25)');
            gradDryer.addColorStop(1, 'rgba(251, 146, 60, 0.0)');

            lineChartInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0') + ':00'),
                    datasets: [
                        {
                            label: 'เครื่องซักผ้า',
                            data: cacheData.washerHourly,
                            borderColor: '#38bdf8',
                            backgroundColor: gradWasher,
                            fill: true,
                            tension: 0.4,
                            pointBackgroundColor: '#38bdf8',
                            pointHoverRadius: 6
                        },
                        {
                            label: 'เครื่องอบผ้า',
                            data: cacheData.dryerHourly,
                            borderColor: '#fb923c',
                            backgroundColor: gradDryer,
                            fill: true,
                            tension: 0.4,
                            pointBackgroundColor: '#fb923c',
                            pointHoverRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: textColor, font: { family: 'Kanit' } } },
                        tooltip: { callbacks: { label: (ctx) => ` รายได้สะสม: ${ctx.raw} ฿` } }
                    },
                    scales: {
                        x: {
                            grid: { color: gridColor },
                            ticks: { color: textColor, font: { family: 'Kanit' }, maxRotation: 45, minRotation: 45 }
                        },
                        y: {
                            grid: { color: gridColor },
                            ticks: { color: textColor, font: { family: 'Kanit' } },
                            beginAtZero: true
                        }
                    }
                }
            });

            if (barChartInstance) barChartInstance.destroy();
            const themeColors = ['#facc15', '#f97316', '#ef4444', '#c026d3', '#2563eb', '#06b6d4', '#84cc16'];
            const backgroundColors = cacheData.deviceLabels.map((_, i) => themeColors[i % themeColors.length]);

            barChartInstance = new Chart(document.getElementById('horizontalBarChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: cacheData.deviceLabels,
                    datasets: [{
                        data: cacheData.deviceTotals,
                        backgroundColor: backgroundColors,
                        borderRadius: 20,
                        borderSkipped: false,
                        barThickness: 12
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: (ctx) => ` รายได้: ${ctx.raw} ฿` } }
                    },
                    scales: {
                        x: {
                            grid: { color: gridColor },
                            ticks: { color: textColor, font: { family: 'Kanit' } }
                        },
                        y: {
                            grid: { display: false },
                            ticks: { color: textColor, font: { family: 'Kanit' } }
                        }
                    }
                }
            });
        }

        // 🌟 3. ระบบเริ่มต้นการทำงานเมื่อโหลดหน้าเว็บ
        async function initDashboard() {
            await loadBranches(); // รอโหลดรายชื่อสาขาให้เสร็จก่อน
            await fetchData();    // แล้วค่อยโหลดกราฟของสาขาลาดกระบัง
        }

        // เรียกใช้ตอนเปิดเว็บ
        initDashboard();

        // รีเฟรชเงียบๆ ทุก 5 นาที
        setInterval(silentFetchData, 5 * 60 * 1000);

        // เปิดปิด Dark Mode
        function toggleDarkMode() {
            const body = document.body;
            const btn = document.getElementById('theme-toggle-btn');
            body.classList.toggle('dark');
            btn.innerText = body.classList.contains('dark') ? '☀️' : '🌙';
            updateCharts();
        }
    </script>
