<!DOCTYPE html>
<html lang="th" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wash Lover - 3D Neumorphism Pro</title>

    <!-- Bootstrap 5.3 & Chart.js -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            /* ⚪ Light Mode - Soft Clay */
            --bg-main: #E0E5EC;
            --text-main: #2D3748;
            --text-sub: #718096;

            /* Shadows for Light Mode */
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;

            --neo-out: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light);
            --neo-out-hover: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            --neo-in: inset 6px 6px 10px 0 var(--shadow-dark), inset -6px -6px 10px 0 var(--shadow-light);

            /* 3D Accents */
            --c-wsh: #00A3FF;
            --c-dry: #FF6B00;
            --c-inc: #00C853;
            --c-job: #8A2BE2;
        }

        [data-bs-theme="dark"] {
            /* ⚫ Dark Mode - Matte Graphite */
            --bg-main: #2A2D32;
            --text-main: #F7FAFC;
            --text-sub: #A0AEC0;

            /* Shadows for Dark Mode */
            --shadow-light: #373b41;
            --shadow-dark: #1d1f23;

            --neo-out: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            --neo-out-hover: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            --neo-in: inset 6px 6px 10px 0 var(--shadow-dark), inset -6px -6px 10px 0 var(--shadow-light);

            --c-wsh: #00D1FF;
            --c-dry: #FF4D4D;
            --c-inc: #00E676;
            --c-job: #B478FF;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 4rem;
            transition: all 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* 📦 Neumorphic Base Card (นูนขึ้นมา) */
        .neo-card {
            background-color: var(--bg-main);
            border-radius: 24px;
            padding: 1.8rem;
            box-shadow: var(--neo-out);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        /* 🕳️ Neumorphic Inset (บุ๋มลงไป) */
        .neo-inset {
            background-color: var(--bg-main);
            border-radius: 16px;
            padding: 1rem;
            box-shadow: var(--neo-in);
        }

        /* 🎛️ Header */
        .header-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        /* 📱 CSS GRID สำหรับแผงควบคุม (Responsive 100%) */
        .controls-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            margin-bottom: 2rem;
            width: 100%;
        }

        .neo-btn,
        .neo-input {
            background-color: var(--bg-main);
            color: var(--text-main);
            border: none;
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            font-weight: 600;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
            text-align: center;
            font-family: 'Kanit';
        }

        .neo-btn {
            box-shadow: var(--neo-out);
            cursor: pointer;
            appearance: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .neo-btn:hover {
            box-shadow: var(--neo-out-hover);
            transform: translateY(2px);
        }

        .neo-btn:active {
            box-shadow: var(--neo-in);
            transform: translateY(4px);
        }

        select.neo-btn {
            padding-right: 2.5rem;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23718096' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 14px;
        }

        .neo-input {
            box-shadow: var(--neo-in);
            width: 100%;
        }

        .neo-input::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
            filter: invert(0.5);
        }

        [data-bs-theme="dark"] .neo-input::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
        }

        .date-display {
            box-shadow: var(--neo-in);
            color: var(--c-wsh);
            font-weight: 700;
            cursor: default;
        }

        .flex-1 {
            flex: 1;
            min-width: 150px;
        }

        .flex-2 {
            flex: 2;
            min-width: 250px;
        }

        .date-group {
            display: flex;
            gap: 16px;
            width: 100%;
        }

        @media (max-width: 991px) {
            .controls-wrapper {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }

            .neo-btn,
            .neo-input,
            .date-display {
                width: 100%;
                text-align: center;
            }

            select.neo-btn {
                text-align-last: center;
            }

            .date-group {
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }

            .theme-btn {
                position: absolute;
                top: 1.5rem;
                right: 1rem;
                width: 48px;
                height: 48px;
            }
        }

        /* 📊 3D Stat Cards */
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .stat-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-footer {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .stat-value {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1;
            margin: 0;
            letter-spacing: -1px;
            word-break: break-word;
        }

        .stat-unit {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-top: 6px;
        }

        .orb-3d {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light), inset 2px 2px 5px rgba(255, 255, 255, 0.4), inset -2px -2px 5px rgba(0, 0, 0, 0.2);
        }

        .orb-inc {
            background: linear-gradient(145deg, #00E676, #00A3FF);
        }

        .orb-job {
            background: linear-gradient(145deg, #B478FF, #6A1B9A);
        }

        .orb-wsh {
            background: linear-gradient(145deg, #00D1FF, #0052D4);
        }

        .orb-dry {
            background: linear-gradient(145deg, #FF6B00, #D50000);
        }

        @media (max-width: 767px) {
            .stat-value {
                font-size: 2.2rem;
            }
        }

        /* 💬 Feed Section */
        .feed-container {
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .feed-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-main);
            padding: 1rem 1.2rem;
            border-radius: 16px;
            box-shadow: var(--neo-out);
            transition: 0.2s;
        }

        .feed-item:hover {
            box-shadow: var(--neo-out-hover);
            transform: scale(1.01);
        }

        .f-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .f-icon-wrap {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: var(--neo-in);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .f-icon-wrap.w {
            color: var(--c-wsh);
        }

        .f-icon-wrap.d {
            color: var(--c-dry);
        }

        .f-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .f-time {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        .f-price {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-main);
            text-align: right;
        }

        .uptime-badge {
            font-size: 0.7rem;
            font-weight: 700;
            box-shadow: var(--neo-in);
            padding: 4px 10px;
            border-radius: 50px;
            color: var(--text-sub);
        }

        /* 🟢 Loader */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .loader-outer {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--bg-main);
            box-shadow: var(--neo-out);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .loader-spinner {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: var(--c-wsh);
            border-right-color: var(--c-job);
            animation: spin-ring 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .loader-inner {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: var(--bg-main);
            box-shadow: var(--neo-in);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .loader-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            animation: float-logo 2s ease-in-out infinite;
            filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.1));
        }

        .loader-text {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--text-sub);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 2rem;
        }

        .dot-1,
        .dot-2,
        .dot-3 {
            animation: blink-dot 1.4s infinite both;
        }

        .dot-2 {
            animation-delay: 0.2s;
        }

        .dot-3 {
            animation-delay: 0.4s;
        }

        @keyframes spin-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes float-logo {

            0%,
            100% {
                transform: translateY(0px) scale(1);
                opacity: 1;
            }

            50% {
                transform: translateY(-4px) scale(0.95);
                opacity: 0.7;
            }
        }

        @keyframes blink-dot {
            0% {
                opacity: 0.2;
            }

            20% {
                opacity: 1;
            }

            100% {
                opacity: 0.2;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-main);
            box-shadow: var(--neo-in);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--text-sub);
            border-radius: 10px;
        }
    </style>
</head>

    <!-- Script ควบคุม -->
    <script>
        const DB_API_URL = 'https://api.all123th.com/inw/api/wl_transactions/';
        const BRANCH_API_URL = 'https://washing.adokub.com/api/branch';

        let doughnutChartInstance = null; let barChartInstance = null; let lineChartInstance = null;
        let cacheData = { washer: 0, dryer: 0, deviceLabels: [], deviceTotals: [], washerHourly: Array(24).fill(0), dryerHourly: Array(24).fill(0) };

        function getCSSVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
        function renderIcons() { lucide.createIcons(); }

        function toggleDarkMode() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', newTheme);
            document.getElementById('theme-icon').setAttribute('data-lucide', newTheme === 'dark' ? 'sun' : 'moon');
            const mobileIcon = document.getElementById('theme-icon-mobile');
            if (mobileIcon) mobileIcon.setAttribute('data-lucide', newTheme === 'dark' ? 'sun' : 'moon');
            renderIcons(); updateCharts();
        }

        // 🔢 ฟังก์ชันสร้างเอฟเฟกต์ตัวเลขวิ่ง (Count-up / Count-down)
        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            if (!obj) return;
            if (start === end) {
                obj.innerHTML = end.toLocaleString();
                return;
            }
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3); // ease-out-cubic
                const currentVal = Math.floor(easeProgress * (end - start) + start);
                obj.innerHTML = currentVal.toLocaleString();
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end.toLocaleString();
                }
            };
            window.requestAnimationFrame(step);
        }

        async function loadBranches() {
            try {
                const res = await fetch(BRANCH_API_URL);
                const branches = await res.json();
                const branchSelect = document.getElementById('branchFilter');
                branchSelect.innerHTML = '<option value="all">รวมทุกสาขา</option>';
                branches.forEach(b => {
                    const option = document.createElement('option');
                    option.value = b.serial; option.textContent = b.name;
                    branchSelect.appendChild(option);
                });
                branchSelect.value = 'ladkabung';
            } catch (error) {
                document.getElementById('branchFilter').innerHTML = `<option value="all">รวมทุกสาขา</option><option value="ladkabung" selected>ลาดกระบัง</option>`;
            }
        }

        const PAGE_SIZE = 2000; const MAX_PAGES = 20;

        async function fetchAllTransactionsInRange(startDateOnly, endDateOnly, selectedBranch) {
            let allRows = []; let offset = 0; let page = 0;
            while (page < MAX_PAGES) {
                const params = new URLSearchParams({ form: 'date', start: startDateOnly, end: endDateOnly, orderby: 'timestamp', by: 'DESC', limit: `${offset},${PAGE_SIZE}` });
                const res = await fetch(`${DB_API_URL}?${params.toString()}`);
                const json = await res.json();
                const rows = Array.isArray(json) ? json : (json.data || []);
                allRows = allRows.concat(rows);
                if (rows.length < PAGE_SIZE) break;
                offset += PAGE_SIZE; page++;
            }
            return allRows;
        }

        async function fetchData() {
            const loader = document.getElementById('loading-overlay');
            loader.style.display = 'flex'; loader.style.opacity = '1';
            try {
                const dates = getDateRange();
                const selectedBranch = document.getElementById('branchFilter').value;
                const rawTransactions = await fetchAllTransactionsInRange(dates.start, dates.end, selectedBranch);
                const targetStart = dates.start + " 00:00:00"; const targetEnd = dates.end + " 23:59:59";

                const filteredTransactions = rawTransactions.filter(t => {
                    if (!t.timestamp) return false;
                    return (t.timestamp >= targetStart && t.timestamp <= targetEnd) && (selectedBranch === 'all' || t.branch === selectedBranch);
                });
                processDataAndRender(filteredTransactions);
            } catch (err) { console.error(err) } finally {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);
            }
        }

        async function silentFetchData() {
            try {
                const dates = getDateRange(); const selectedBranch = document.getElementById('branchFilter').value;
                const rawTransactions = await fetchAllTransactionsInRange(dates.start, dates.end, selectedBranch);
                const targetStart = dates.start + " 00:00:00"; const targetEnd = dates.end + " 23:59:59";
                const filteredTransactions = rawTransactions.filter(t => {
                    if (!t.timestamp) return false;
                    return (t.timestamp >= targetStart && t.timestamp <= targetEnd) && (selectedBranch === 'all' || t.branch === selectedBranch);
                });
                processDataAndRender(filteredTransactions);
            } catch (err) { }
        }

        function formatUptimeBadge(minutes) {
            if (minutes === null || minutes === undefined || isNaN(minutes)) return "";
            let m = parseInt(minutes);
            let timeText = m >= 1440 ? `${Math.floor(m / 1440)}d ${Math.floor((m % 1440) / 60)}h` : m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
            return `<span class="uptime-badge"><i data-lucide="clock" style="width: 10px; margin-right: 4px; display:inline-block;"></i>${timeText}</span>`;
        }

        function processDataAndRender(transactions) {
            let totalIncome = 0; let totalJobs = transactions.length;
            let washerCount = 0; let dryerCount = 0;
            const deviceIncomeMap = {};
            const washerHourly = Array(24).fill(0); const dryerHourly = Array(24).fill(0);

            transactions.forEach((t) => {
                const coins = parseInt(t.coins_paid) || 0; const incomeBaht = coins * 10;
                totalIncome += incomeBaht;
                const isDryer = t.machine_type === 'Dryer' || t.device_name.includes('อบ');
                if (isDryer) dryerCount++; else washerCount++;
                if (incomeBaht > 0) deviceIncomeMap[t.device_name] = (deviceIncomeMap[t.device_name] || 0) + incomeBaht;
                const hour = parseInt(t.timestamp.substring(11, 13));
                if (!isNaN(hour) && hour >= 0 && hour < 24) {
                    if (isDryer) dryerHourly[hour] += incomeBaht; else washerHourly[hour] += incomeBaht;
                }
            });

            const displayTransactions = transactions.slice(0, 100);

            const feedHtml = displayTransactions.length ? displayTransactions.map((t) => {
                const coins = parseInt(t.coins_paid) || 0; const incomeBaht = coins * 10;
                const isDryer = t.machine_type === 'Dryer' || t.device_name.includes('อบ');
                const uptimeBadge = formatUptimeBadge(t.uptime_minutes);

                const iconClass = isDryer ? 'd' : 'w';
                const iconName = isDryer ? 'flame' : 'waves';
                return `
                <div class="feed-item">
                    <div class="f-left">
                        <div class="f-icon-wrap ${iconClass}"><i data-lucide="${iconName}" style="width: 18px;"></i></div>
                        <div>
                            <div class="f-name">${t.device_name}</div>
                            <div class="f-time">
                                <span>${t.timestamp.substring(11, 16)}</span>
                                <span class="mx-1">&bull;</span>
                                <span>${t.timestamp.substring(5, 10).replace('-', '/')}</span>
                                ${uptimeBadge ? `<span class="mx-1">&bull;</span>${uptimeBadge}` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="f-price">+${incomeBaht}<span style="font-size: 0.8rem; font-weight: normal; color: var(--text-sub); margin-left: 2px;">฿</span></div>
                </div>`;
            }).join('') : `<div class="text-center py-5 fw-bold" style="color: var(--text-sub);">ไม่พบข้อมูล</div>`;

            // ดึงค่าเก่าบนหน้าจอมาเพื่อทำเอฟเฟกต์ตัวเลขวิ่ง
            const oldCoins = parseInt(document.getElementById('statCoins').innerText.replace(/,/g, '')) || 0;
            const oldJobs = parseInt(document.getElementById('statJobs').innerText.replace(/,/g, '')) || 0;
            const oldWasher = parseInt(document.getElementById('statWasher').innerText.replace(/,/g, '')) || 0;
            const oldDryer = parseInt(document.getElementById('statDryer').innerText.replace(/,/g, '')) || 0;

            // รันอนิเมชัน 1.5 วินาที (1500ms)
            animateValue('statCoins', oldCoins, totalIncome, 1500);
            animateValue('statJobs', oldJobs, totalJobs, 1500);
            animateValue('statWasher', oldWasher, washerCount, 1500);
            animateValue('statDryer', oldDryer, dryerCount, 1500);

            document.getElementById('tableBody').innerHTML = feedHtml;

            renderIcons();
            const sortedDevices = Object.entries(deviceIncomeMap)
                .map(([name, total]) => ({ name, total }))
                .sort((a, b) => {
                    const isAWasher = a.name.includes('ซัก'); const isBWasher = b.name.includes('ซัก');
                    if (isAWasher && !isBWasher) return -1; if (!isAWasher && isBWasher) return 1;
                    return parseInt(a.name.match(/\d+$/)?.[0] || 0) - parseInt(b.name.match(/\d+$/)?.[0] || 0);
                });
            cacheData.washer = washerCount; cacheData.dryer = dryerCount;
            cacheData.deviceLabels = sortedDevices.map(d => d.name);
            cacheData.deviceTotals = sortedDevices.map(d => d.total);
            cacheData.washerHourly = washerHourly; cacheData.dryerHourly = dryerHourly;
            updateCharts();
        }

        function checkFilter() {
            const isCustom = document.getElementById('timeFilter').value === 'custom';
            const wrapper = document.getElementById('customDateWrapper');
            const btnSearch = document.getElementById('btnSearchCustom');
            if (isCustom) {
                wrapper.classList.remove('d-none');
                btnSearch.classList.remove('d-none');
            } else {
                wrapper.classList.add('d-none');
                btnSearch.classList.add('d-none');
                fetchData();
            }
        }

        function formatThaiDateShort(dateStr) {
            if (!dateStr) return "-"; const parts = dateStr.split('-');
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${parseInt(parts[2])} ${months[parseInt(parts[1]) - 1]}`;
        }

        function getDateRange() {
            const f = document.getElementById('timeFilter').value; let startStr = "", endStr = "";
            const formatDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            if (f === 'custom') { startStr = document.getElementById('customDateStart').value; endStr = document.getElementById('customDateEnd').value; }
            else {
                const t = new Date(), s = new Date();
                if (f === 'weekly') s.setDate(t.getDate() - 7); if (f === 'monthly') s.setDate(t.getDate() - 30);
                startStr = formatDate(s); endStr = formatDate(t);
            }
            const dateText = startStr === endStr ? `${formatThaiDateShort(startStr)}` : `${formatThaiDateShort(startStr)} - ${formatThaiDateShort(endStr)}`;
            document.getElementById('dateText').innerText = dateText;
            return { start: startStr, end: endStr };
        }

        // Charts
        Chart.defaults.font.family = "'Kanit', sans-serif";

        function updateCharts() {
            const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
            const textColor = isDark ? '#A0AEC0' : '#718096';
            const colorW = getCSSVar('--c-wsh');
            const colorD = getCSSVar('--c-dry');

            Chart.defaults.color = textColor;

            const commonOptions = {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8, font: { size: 12, weight: '600' } } },
                    tooltip: { backgroundColor: isDark ? '#1A202C' : '#FFFFFF', titleColor: isDark ? '#F7FAFC' : '#111827', bodyColor: textColor, borderWidth: 0, padding: 12, cornerRadius: 12, boxShadow: '0 4px 6px rgba(0,0,0,0.1)' }
                }
            };

            // 🌟 1. กราฟวงกลม: เพิ่มแอนิเมชัน Pop & Rotate
            if (doughnutChartInstance) doughnutChartInstance.destroy();
            doughnutChartInstance = new Chart(document.getElementById('doughnutChart').getContext('2d'), {
                type: 'doughnut',
                data: { labels: ['ซักผ้า', 'อบผ้า'], datasets: [{ data: [cacheData.washer, cacheData.dryer], backgroundColor: [colorW, colorD], borderWidth: 0, hoverOffset: 5 }] },
                options: {
                    ...commonOptions,
                    cutout: '80%',
                    animation: {
                        animateScale: true,
                        animateRotate: true,
                        duration: 1500,
                        easing: 'easeOutBounce'
                    },
                    plugins: { ...commonOptions.plugins, legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20 } } }
                }
            });

            // 🌟 2. กราฟเส้น: เพิ่มแอนิเมชันวาดเส้น
            if (lineChartInstance) lineChartInstance.destroy();
            const ctxLine = document.getElementById('peakHoursLineChart').getContext('2d');

            lineChartInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0') + ':00'),
                    datasets: [
                        { label: 'ซักผ้า', data: cacheData.washerHourly, borderColor: colorW, backgroundColor: colorW + '10', fill: true, tension: 0.4, borderWidth: 3, pointRadius: 0, pointHoverRadius: 6 },
                        { label: 'อบผ้า', data: cacheData.dryerHourly, borderColor: colorD, backgroundColor: colorD + '10', fill: true, tension: 0.4, borderWidth: 3, pointRadius: 0, pointHoverRadius: 6 }
                    ]
                },
                options: {
                    ...commonOptions,
                    interaction: { mode: 'index', intersect: false },
                    animation: {
                        duration: 1500,
                        easing: 'easeOutQuart'
                    },
                    scales: { x: { grid: { display: false } }, y: { grid: { display: false }, border: { display: false }, beginAtZero: true } }
                }
            });

            // 🌟 3. กราฟแท่ง: เพิ่มแอนิเมชันวิ่งไล่ระดับ (Staggered Delay)
            if (barChartInstance) barChartInstance.destroy();
            barChartInstance = new Chart(document.getElementById('horizontalBarChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: cacheData.deviceLabels,
                    datasets: [{ data: cacheData.deviceTotals, backgroundColor: cacheData.deviceLabels.map(l => l.includes('ซัก') ? colorW : colorD), borderRadius: 8, barPercentage: 0.5 }]
                },
                options: {
                    ...commonOptions,
                    indexAxis: 'y',
                    animation: {
                        duration: 1000,
                        easing: 'easeOutQuart',
                        delay: (context) => {
                            let delay = 0;
                            if (context.type === 'data') {
                                delay = context.dataIndex * 100;
                            }
                            return delay;
                        }
                    },
                    plugins: { legend: { display: false }, tooltip: commonOptions.plugins.tooltip },
                    scales: { x: { grid: { display: false }, border: { display: false } }, y: { grid: { display: false }, border: { display: false }, ticks: { color: isDark ? '#F7FAFC' : '#111827', font: { weight: 'bold' } } } }
                }
            });
        }

        async function initDashboard() {
            renderIcons();
            document.getElementById('customDateStart').valueAsDate = new Date(); document.getElementById('customDateEnd').valueAsDate = new Date();
            await loadBranches(); await fetchData();
        }

        initDashboard(); setInterval(silentFetchData, 5 * 60 * 1000);
        window.addEventListener('resize', () => { setTimeout(() => { if (lineChartInstance) updateCharts(); }, 250); });
    </script>
</body>

</html>
