<!DOCTYPE html>
<html lang="th" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wash Lover - Premium Dashboard</title>

    <!-- Bootstrap 5.3 & Chart.js -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* ⚪ Light Mode - Clean & Soft */
            --bg-body: #F8FAFC;
            --bg-card: #FFFFFF;
            --bg-input: #F1F5F9;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --border-color: #E2E8F0;
            --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 12px 25px -5px rgba(0, 0, 0, 0.08);

            /* 🌈 สี Gradient */
            --grad-inc: linear-gradient(135deg, #10B981 0%, #059669 100%);
            --grad-job: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
            --grad-wsh: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            --grad-dry: linear-gradient(135deg, #F97316 0%, #EA580C 100%);

            --bg-inc: #ECFDF5;
            --bg-job: #F5F3FF;
            --bg-wsh: #EFF6FF;
            --bg-dry: #FFF7ED;
        }

        [data-bs-theme="dark"] {
            /* ⚫ Dark Mode */
            --bg-body: #0B1121;
            --bg-card: #151E2E;
            --bg-input: #1E293B;
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --border-color: #2A374A;
            --shadow-card: 0 10px 25px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 15px 35px rgba(0, 0, 0, 0.5);

            --bg-inc: rgba(16, 185, 129, 0.15);
            --bg-job: rgba(139, 92, 246, 0.15);
            --bg-wsh: rgba(59, 130, 246, 0.15);
            --bg-dry: rgba(249, 115, 22, 0.15);
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 4rem;
            transition: all 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* 📦 Card Design */
        .pro-card {
            background-color: var(--bg-card);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            /* ลบ height: 100% ออกเพื่อไม่ให้มันยืดตามคอลัมน์อื่น */
        }

        .pro-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        /* ✨ แถบสีไล่ระดับด้านบน */
        .card-accent::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        .accent-inc::before {
            background: var(--grad-inc);
        }

        .accent-job::before {
            background: var(--grad-job);
        }

        .accent-wsh::before {
            background: var(--grad-wsh);
        }

        .accent-dry::before {
            background: var(--grad-dry);
        }

        /* 🌈 ไอคอนพร้อมเงา */
        .emoji-box {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        .pro-card:hover .emoji-box {
            transform: scale(1.1) rotate(5deg);
        }

        .e-inc {
            background-color: var(--bg-inc);
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.2);
        }

        .e-job {
            background-color: var(--bg-job);
            box-shadow: 0 8px 16px rgba(139, 92, 246, 0.2);
        }

        .e-wsh {
            background-color: var(--bg-wsh);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.2);
        }

        .e-dry {
            background-color: var(--bg-dry);
            box-shadow: 0 8px 16px rgba(249, 115, 22, 0.2);
        }

        /* 📊 Stats Cards Header */
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.1;
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* 🎛️ Header & Controls */
        .header-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .controls-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 2rem;
        }

        .filter-item {
            flex: 1 1 200px;
        }

        .date-group {
            display: flex;
            gap: 10px;
            flex: 2 1 320px !important;
        }

        .date-group input {
            flex: 1 1 50%;
            width: 100%;
        }

        .pro-btn,
        .pro-input {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid transparent;
            border-radius: 14px;
            padding: 0.8rem 1.2rem;
            font-weight: 500;
            outline: none;
            width: 100%;
            height: 100%;
            font-family: 'Kanit';
            transition: all 0.2s ease;
        }

        .pro-btn:hover,
        .pro-input:focus {
            background-color: var(--bg-card);
            border: 1px solid #3B82F6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
        }

        .pro-btn {
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        select.pro-btn {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%2364748B' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 14px;
            text-align: left;
        }

        .date-display {
            cursor: default;
        }

        /* 📈 ล็อคความสูงของกราฟให้คงที่ */
        .chart-container-line {
            height: 350px;
            width: 100%;
            position: relative;
        }

        .chart-container-small {
            height: 220px;
            width: 100%;
            position: relative;
        }

        /* 💬 Feed Section (ล็อคความสูงให้สมดุลกับฝั่งซ้าย) */
        .feed-container {
            height: 645px;
            /* ความสูงพอดีกับกราฟ 2 ชั้นฝั่งซ้าย */
            overflow-y: auto;
            padding-right: 5px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feed-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-input);
            padding: 1rem 1.2rem;
            border-radius: 18px;
            border: 1px solid transparent;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .feed-item:hover {
            background: var(--bg-card);
            border-color: var(--border-color);
            box-shadow: var(--shadow-card);
            transform: scale(1.02);
        }

        .f-icon-small {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
        }

        .f-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .f-time {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .f-price {
            font-size: 1.15rem;
            font-weight: 800;
            color: #10B981;
        }

        .uptime-badge {
            font-size: 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            color: var(--text-sub);
        }

        /* 🟢 Loader */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(248, 250, 252, 0.9);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        [data-bs-theme="dark"] #loading-overlay {
            background: rgba(11, 17, 33, 0.9);
        }

        .loader-logo {
            width: 70px;
            height: 70px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }

        [data-bs-theme="dark"] ::-webkit-scrollbar-thumb {
            background: #334155;
        }

        /* Responsive Fix */
        @media (max-width: 768px) {
            .filter-item {
                flex: 1 1 100%;
            }

            .date-group {
                flex-direction: row;
                flex: 1 1 100% !important;
            }

            .header-wrap {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .theme-btn-desktop {
                display: none;
            }

            .theme-btn-mobile {
                display: block;
                position: absolute;
                top: 1rem;
                right: 1rem;
            }

            /* ลดความสูงของตารางในมือถือไม่ให้ยาวเกินไป */
            .feed-container {
                height: 400px;
            }
        }

        @media (min-width: 769px) {
            .theme-btn-mobile {
                display: none;
            }
        }
    </style>
</head>

    <!-- Script ควบคุม -->
    <script>
        const DB_API_URL = 'https://api.all123th.com/inw/api/wl_transactions/';
        const BRANCH_API_URL = 'https://washing.adokub.com/api/branch';

        let doughnutChartInstance = null; let barChartInstance = null; let lineChartInstance = null;
        let cacheData = { washer: 0, dryer: 0, deviceLabels: [], deviceTotals: [], washerHourly: Array(24).fill(0), dryerHourly: Array(24).fill(0) };

        function getCSSVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

        function toggleDarkMode() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', newTheme);

            const iconStr = newTheme === 'dark' ? '☀️' : '🌙';
            document.getElementById('theme-icon').innerText = iconStr;
            document.getElementById('theme-icon-mobile').innerText = iconStr;

            updateCharts();
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            if (!obj) return;
            if (start === end) { obj.innerHTML = end.toLocaleString(); return; }
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                const currentVal = Math.floor(easeProgress * (end - start) + start);
                obj.innerHTML = currentVal.toLocaleString();
                if (progress < 1) window.requestAnimationFrame(step);
                else obj.innerHTML = end.toLocaleString();
            };
            window.requestAnimationFrame(step);
        }

        async function loadBranches() {
            try {
                const res = await fetch(BRANCH_API_URL);
                const branches = await res.json();
                const branchSelect = document.getElementById('branchFilter');
                branchSelect.innerHTML = '<option value="all">🏪 รวมทุกสาขา</option>';
                branches.forEach(b => {
                    const option = document.createElement('option');
                    option.value = b.serial; option.textContent = `📍 ${b.name}`;
                    branchSelect.appendChild(option);
                });
                branchSelect.value = 'ladkabung';
            } catch (error) {
                document.getElementById('branchFilter').innerHTML = `<option value="all">🏪 รวมทุกสาขา</option><option value="ladkabung" selected>📍 ลาดกระบัง</option>`;
            }
        }

        const PAGE_SIZE = 2000; const MAX_PAGES = 20;

        async function fetchAllTransactionsInRange(startDateOnly, endDateOnly, selectedBranch) {
            let allRows = []; let offset = 0; let page = 0;
            while (page < MAX_PAGES) {
                const params = new URLSearchParams({ form: 'date', start: startDateOnly, end: endDateOnly, orderby: 'timestamp', by: 'DESC', limit: `${offset},${PAGE_SIZE}` });
                const res = await fetch(`${DB_API_URL}?${params.toString()}`);
                const json = await res.json();
                const rows = Array.isArray(json) ? json : (json.data || []);
                allRows = allRows.concat(rows);
                if (rows.length < PAGE_SIZE) break;
                offset += PAGE_SIZE; page++;
            }
            return allRows;
        }

        async function fetchData() {
            const loader = document.getElementById('loading-overlay');
            loader.style.display = 'flex'; loader.style.opacity = '1';
            try {
                const dates = getDateRange();
                const selectedBranch = document.getElementById('branchFilter').value;
                const rawTransactions = await fetchAllTransactionsInRange(dates.start, dates.end, selectedBranch);
                const targetStart = dates.start + " 00:00:00"; const targetEnd = dates.end + " 23:59:59";

                const filteredTransactions = rawTransactions.filter(t => {
                    if (!t.timestamp) return false;
                    return (t.timestamp >= targetStart && t.timestamp <= targetEnd) && (selectedBranch === 'all' || t.branch === selectedBranch);
                });
                processDataAndRender(filteredTransactions);
            } catch (err) { console.error(err) } finally {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);
            }
        }

        async function silentFetchData() {
            try {
                const dates = getDateRange(); const selectedBranch = document.getElementById('branchFilter').value;
                const rawTransactions = await fetchAllTransactionsInRange(dates.start, dates.end, selectedBranch);
                const targetStart = dates.start + " 00:00:00"; const targetEnd = dates.end + " 23:59:59";
                const filteredTransactions = rawTransactions.filter(t => {
                    if (!t.timestamp) return false;
                    return (t.timestamp >= targetStart && t.timestamp <= targetEnd) && (selectedBranch === 'all' || t.branch === selectedBranch);
                });
                processDataAndRender(filteredTransactions);
            } catch (err) { }
        }

        function formatUptimeBadge(minutes) {
            if (minutes === null || minutes === undefined || isNaN(minutes)) return "";
            let m = parseInt(minutes);
            let timeText = m >= 1440 ? `${Math.floor(m / 1440)}d ${Math.floor((m % 1440) / 60)}h` : m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
            return `<span class="uptime-badge">⌛ ${timeText}</span>`;
        }

        function processDataAndRender(transactions) {
            let totalIncome = 0; let totalJobs = transactions.length;
            let washerCount = 0; let dryerCount = 0;
            const deviceIncomeMap = {};
            const washerHourly = Array(24).fill(0); const dryerHourly = Array(24).fill(0);

            transactions.forEach((t) => {
                const coins = parseInt(t.coins_paid) || 0; const incomeBaht = coins * 10;
                totalIncome += incomeBaht;
                const isDryer = t.machine_type === 'Dryer' || t.device_name.includes('อบ');
                if (isDryer) dryerCount++; else washerCount++;
                if (incomeBaht > 0) deviceIncomeMap[t.device_name] = (deviceIncomeMap[t.device_name] || 0) + incomeBaht;
                const hour = parseInt(t.timestamp.substring(11, 13));
                if (!isNaN(hour) && hour >= 0 && hour < 24) {
                    if (isDryer) dryerHourly[hour] += incomeBaht; else washerHourly[hour] += incomeBaht;
                }
            });

            const displayTransactions = transactions.slice(0, 100);

            const feedHtml = displayTransactions.length ? displayTransactions.map((t) => {
                const coins = parseInt(t.coins_paid) || 0; const incomeBaht = coins * 10;
                const isDryer = t.machine_type === 'Dryer' || t.device_name.includes('อบ');
                const uptimeBadge = formatUptimeBadge(t.uptime_minutes);

                const iconBg = isDryer ? 'var(--bg-dry)' : 'var(--bg-wsh)';
                const emoji = isDryer ? '♨️' : '🌊';

                return `
                <div class="feed-item">
                    <div class="d-flex align-items-center gap-3">
                        <div class="f-icon-small" style="background-color: ${iconBg};">${emoji}</div>
                        <div>
                            <div class="f-name">${t.device_name}</div>
                            <div class="f-time">
                                <span>${t.timestamp.substring(11, 16)}</span>
                                <span class="mx-1">•</span>
                                <span>${t.timestamp.substring(5, 10).replace('-', '/')}</span>
                                ${uptimeBadge ? `<span class="mx-1">•</span>${uptimeBadge}` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="f-price">+${incomeBaht}<span style="font-size: 0.8rem; font-weight: 500; color: var(--text-sub); margin-left: 2px;">฿</span></div>
                </div>`;
            }).join('') : `<div class="text-center py-5 fw-bold" style="color: var(--text-sub);">📭 ไม่พบข้อมูลในช่วงเวลานี้</div>`;

            const oldCoins = parseInt(document.getElementById('statCoins').innerText.replace(/,/g, '')) || 0;
            const oldJobs = parseInt(document.getElementById('statJobs').innerText.replace(/,/g, '')) || 0;
            const oldWasher = parseInt(document.getElementById('statWasher').innerText.replace(/,/g, '')) || 0;
            const oldDryer = parseInt(document.getElementById('statDryer').innerText.replace(/,/g, '')) || 0;

            animateValue('statCoins', oldCoins, totalIncome, 1000);
            animateValue('statJobs', oldJobs, totalJobs, 1000);
            animateValue('statWasher', oldWasher, washerCount, 1000);
            animateValue('statDryer', oldDryer, dryerCount, 1000);

            document.getElementById('tableBody').innerHTML = feedHtml;

            const sortedDevices = Object.entries(deviceIncomeMap)
                .map(([name, total]) => ({ name, total }))
                .sort((a, b) => {
                    const isAWasher = a.name.includes('ซัก'); const isBWasher = b.name.includes('ซัก');
                    if (isAWasher && !isBWasher) return -1; if (!isAWasher && isBWasher) return 1;
                    return parseInt(a.name.match(/\d+$/)?.[0] || 0) - parseInt(b.name.match(/\d+$/)?.[0] || 0);
                });
            cacheData.washer = washerCount; cacheData.dryer = dryerCount;
            cacheData.deviceLabels = sortedDevices.map(d => d.name);
            cacheData.deviceTotals = sortedDevices.map(d => d.total);
            cacheData.washerHourly = washerHourly; cacheData.dryerHourly = dryerHourly;
            updateCharts();
        }

        function checkFilter() {
            const isCustom = document.getElementById('timeFilter').value === 'custom';
            const wrapper = document.getElementById('customDateWrapper');
            const btnSearch = document.getElementById('btnSearchCustom');

            if (isCustom) {
                wrapper.classList.remove('d-none');
                btnSearch.classList.remove('d-none');
            } else {
                wrapper.classList.add('d-none');
                btnSearch.classList.add('d-none');
                fetchData();
            }
        }

        function formatThaiDateShort(dateStr) {
            if (!dateStr) return "-"; const parts = dateStr.split('-');
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${parseInt(parts[2])} ${months[parseInt(parts[1]) - 1]} ${parts[0]}`;
        }

        function getDateRange() {
            const f = document.getElementById('timeFilter').value; let startStr = "", endStr = "";
            const formatDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            if (f === 'custom') { startStr = document.getElementById('customDateStart').value; endStr = document.getElementById('customDateEnd').value; }
            else {
                const t = new Date(), s = new Date();
                if (f === 'weekly') s.setDate(t.getDate() - 7); if (f === 'monthly') s.setDate(t.getDate() - 30);
                startStr = formatDate(s); endStr = formatDate(t);
            }
            const dateText = startStr === endStr ? `${formatThaiDateShort(startStr)}` : `${formatThaiDateShort(startStr)} - ${formatThaiDateShort(endStr)}`;
            document.getElementById('dateText').innerText = dateText;
            return { start: startStr, end: endStr };
        }

        // Charts Configuration
        Chart.defaults.font.family = "'Kanit', sans-serif";

        function updateCharts() {
            const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
            const textColor = getCSSVar('--text-sub');
            const gridColor = isDark ? '#2A374A' : '#E2E8F0';

            Chart.defaults.color = textColor;

            const commonOptions = {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8, font: { size: 13, family: "'Kanit', sans-serif", weight: '600' } } },
                    tooltip: { backgroundColor: isDark ? '#0F172A' : '#1E293B', titleColor: '#FFFFFF', bodyColor: '#F8FAFC', padding: 12, cornerRadius: 12 }
                }
            };

            const ctxLine = document.getElementById('peakHoursLineChart').getContext('2d');
            const ctxDoughnut = document.getElementById('doughnutChart').getContext('2d');
            const ctxBar = document.getElementById('horizontalBarChart').getContext('2d');

            const gradWshLine = ctxLine.createLinearGradient(0, 0, 0, 350);
            gradWshLine.addColorStop(0, isDark ? 'rgba(59, 130, 246, 0.4)' : 'rgba(59, 130, 246, 0.25)');
            gradWshLine.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

            const gradDryLine = ctxLine.createLinearGradient(0, 0, 0, 350);
            gradDryLine.addColorStop(0, isDark ? 'rgba(249, 115, 22, 0.4)' : 'rgba(249, 115, 22, 0.25)');
            gradDryLine.addColorStop(1, 'rgba(249, 115, 22, 0.0)');

            const gradWshBar = ctxBar.createLinearGradient(0, 0, 400, 0);
            gradWshBar.addColorStop(0, '#3B82F6'); gradWshBar.addColorStop(1, '#2563EB');

            const gradDryBar = ctxBar.createLinearGradient(0, 0, 400, 0);
            gradDryBar.addColorStop(0, '#F97316'); gradDryBar.addColorStop(1, '#EA580C');

            const barColorsArray = cacheData.deviceLabels.map(l => l.includes('ซัก') ? gradWshBar : gradDryBar);

            const gradWshPie = ctxDoughnut.createLinearGradient(0, 0, 0, 200);
            gradWshPie.addColorStop(0, '#3B82F6'); gradWshPie.addColorStop(1, '#2563EB');

            const gradDryPie = ctxDoughnut.createLinearGradient(0, 0, 0, 200);
            gradDryPie.addColorStop(0, '#F97316'); gradDryPie.addColorStop(1, '#EA580C');

            if (doughnutChartInstance) doughnutChartInstance.destroy();
            doughnutChartInstance = new Chart(ctxDoughnut, {
                type: 'doughnut',
                data: { labels: ['🌊 ซักผ้า', '♨️ อบผ้า'], datasets: [{ data: [cacheData.washer, cacheData.dryer], backgroundColor: [gradWshPie, gradDryPie], borderWidth: 4, borderColor: getCSSVar('--bg-card'), hoverOffset: 6 }] },
                options: {
                    ...commonOptions, cutout: '72%',
                    plugins: { ...commonOptions.plugins, legend: { position: 'bottom', labels: { padding: 20, usePointStyle: true, font: { weight: '600' } } } }
                }
            });

            if (lineChartInstance) lineChartInstance.destroy();
            lineChartInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0') + ':00'),
                    datasets: [
                        { label: '🌊 ซักผ้า', data: cacheData.washerHourly, borderColor: '#3B82F6', backgroundColor: gradWshLine, fill: true, tension: 0.4, borderWidth: 3, pointRadius: 0, pointHoverRadius: 6 },
                        { label: '♨️ อบผ้า', data: cacheData.dryerHourly, borderColor: '#F97316', backgroundColor: gradDryLine, fill: true, tension: 0.4, borderWidth: 3, pointRadius: 0, pointHoverRadius: 6 }
                    ]
                },
                options: {
                    ...commonOptions, interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { grid: { display: false } },
                        y: { border: { display: false }, grid: { color: gridColor, drawBorder: false }, beginAtZero: true }
                    }
                }
            });

            if (barChartInstance) barChartInstance.destroy();
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: cacheData.deviceLabels,
                    datasets: [{ data: cacheData.deviceTotals, backgroundColor: barColorsArray, borderRadius: 8 }]
                },
                options: {
                    ...commonOptions, indexAxis: 'y',
                    plugins: { legend: { display: false }, tooltip: commonOptions.plugins.tooltip },
                    scales: {
                        x: { grid: { color: gridColor }, border: { display: false } },
                        y: { grid: { display: false }, border: { display: false }, ticks: { font: { weight: '600' } } }
                    }
                }
            });
        }

        async function initDashboard() {
            document.getElementById('customDateStart').valueAsDate = new Date(); document.getElementById('customDateEnd').valueAsDate = new Date();
            await loadBranches(); await fetchData();
        }

        initDashboard(); setInterval(silentFetchData, 5 * 60 * 1000);
        window.addEventListener('resize', () => { setTimeout(() => { if (lineChartInstance) updateCharts(); }, 250); });
    </script>
</body>

</html>
