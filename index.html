<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wash Lover - Bento Box Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* 🎨 Bento Background & Grid Pattern */
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f4f4f5;
            /* สีเทาอ่อน Zinc */
            background-image: radial-gradient(#d4d4d8 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #18181b;
            transition: all 0.3s ease;
            min-height: 100vh;
        }

        body.dark {
            background-color: #09090b;
            /* ดำสนิท */
            background-image: radial-gradient(#27272a 1.5px, transparent 1.5px);
            color: #fafafa;
        }

        /* 🍱 Bento Widget Cards */
        .card {
            background: #ffffff;
            border-radius: 32px;
            /* โค้งมนขั้นสุด */
            border: 2px solid #e4e4e7;
            /* เงาแบบแข็ง (Solid Drop Shadow) */
            box-shadow: 4px 6px 0px #e4e4e7;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        body.dark .card {
            background: #18181b;
            border: 2px solid #27272a;
            box-shadow: 4px 6px 0px #000000;
        }

        /* Interactive Hover Action */
        .card:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #e4e4e7;
        }

        body.dark .card:hover {
            box-shadow: 2px 2px 0px #000000;
        }

        /* 🔘 Custom Form Elements */
        select,
        input[type="date"],
        button {
            border-radius: 20px !important;
            border: 2px solid #e4e4e7 !important;
            box-shadow: 2px 4px 0px #e4e4e7;
            transition: all 0.1s;
        }

        body.dark select,
        body.dark input,
        body.dark button {
            border-color: #3f3f46 !important;
            box-shadow: 2px 4px 0px #000000;
            background-color: #27272a !important;
            color: white !important;
        }

        select:active,
        input:active,
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px transparent !important;
        }

        /* 🖌️ Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d4d4d8;
            border-radius: 20px;
        }

        body.dark ::-webkit-scrollbar-thumb {
            background: #3f3f46;
        }

        /* 🚀 Animations */
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .animate-fade {
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .delay-100 {
            animation-delay: 0.1s;
        }

        .delay-200 {
            animation-delay: 0.2s;
        }

        .delay-300 {
            animation-delay: 0.3s;
        }

        /* 💊 Table Pill Style */
        tbody tr {
            border-bottom: 2px dashed #e4e4e7;
        }

        body.dark tbody tr {
            border-bottom: 2px dashed #27272a;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        /* Loader */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(244, 244, 245, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s;
        }

        body.dark #loading-overlay {
            background: rgba(9, 9, 11, 0.95);
        }

        .spinner-logo {
            width: 80px;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-15px);
            }
        }
    </style>
</head>

<body class="p-3 sm:p-5 md:p-8 font-semibold">

    <!-- Loading -->
    <div id="loading-overlay">
        <img src="https://i.ibb.co/v6F6dNMf/logo-removebg-preview.png" class="spinner-logo" alt="Loading...">
        <p class="mt-6 text-lg font-extrabold tracking-widest text-zinc-800 dark:text-zinc-200 uppercase">Syncing...</p>
    </div>

    <div class="max-w-7xl mx-auto space-y-6">

        <!-- 🎛️ Header Console (Bento Style) -->
        <div
            class="card p-4 md:p-6 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 animate-fade">
            <!-- Brand & Tag -->
            <div class="flex items-center gap-4 w-full xl:w-auto">
                <div class="p-3 rounded-2xl shrink-0">
                    <img src="https://i.ibb.co/v6F6dNMf/logo-removebg-preview.png" alt="Logo"
                        class="h-20 w-auto filter drop-shadow-md">
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-pink-600 dark:text-white">
                        WASH<span class="text-cyan-500"> LOVER</span>
                    </h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="relative flex h-3 w-3">
                            <span
                                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                        </span>
                        <span class="text-xs font-bold text-zinc-500 uppercase tracking-wider">System Online</span>
                    </div>
                </div>
            </div>

            <!-- Controls Group -->
            <div class="flex flex-col sm:flex-row flex-wrap items-stretch sm:items-center gap-3 w-full xl:w-auto">
                <!-- Location -->
                <select id="branchFilter" onchange="fetchData()"
                    class="bg-white dark:bg-zinc-800 text-sm font-bold px-5 py-3 outline-none cursor-pointer w-full sm:w-auto">
                    <option value="all">กำลังโหลดสาขา...</option>
                </select>

                <!-- Date Info -->
                <div id="dateRangeDisplay"
                    class="text-xs text-zinc-500 font-bold px-5 py-3 bg-zinc-200/50 dark:bg-zinc-800/50 rounded-2xl w-full sm:w-auto text-center border-2 border-transparent">
                    📅 กำลังโหลด...
                </div>

                <div id="customDateWrapper" class="hidden flex-col sm:flex-row gap-2 w-full sm:w-auto">
                    <input type="date" id="customDateStart" class="bg-white px-4 py-3 text-sm outline-none w-full">
                    <input type="date" id="customDateEnd" class="bg-white px-4 py-3 text-sm outline-none w-full">
                </div>

                <div class="flex gap-2 w-full sm:w-auto">
                    <select id="timeFilter" onchange="checkFilter()"
                        class="flex-1 sm:flex-none bg-white px-4 py-3 text-sm outline-none cursor-pointer">
                        <option value="daily">วันนี้</option>
                        <option value="weekly">7 วันล่าสุด</option>
                        <option value="monthly">30 วันล่าสุด</option>
                        <option value="custom">กำหนดเอง</option>
                    </select>
                    <button id="btnSearchCustom" onclick="fetchData()"
                        class="bg-blue-600 border-blue-700 text-white px-6 py-3 hidden text-sm shadow-[2px_4px_0px_#1d4ed8]">ค้นหา</button>
                    <button id="theme-toggle-btn" onclick="toggleDarkMode()"
                        class="px-4 py-3 bg-white text-xl">⚡</button>
                </div>
            </div>
        </div>

        <!-- 🧩 Stats Widgets (Bento Grid) -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 animate-fade delay-100">
            <!-- Widget: รายได้ -->
            <div class="card p-5 md:p-6 bg-[#E0F2FE] dark:bg-[#082F49] border-[#bae6fd] dark:border-[#0369a1]">
                <div class="flex justify-between items-start mb-4">
                    <span
                        class="text-xs md:text-sm font-extrabold uppercase text-[#0284c7] dark:text-[#38bdf8] tracking-wider">Revenue</span>
                    <span class="text-2xl bg-white dark:bg-zinc-900 p-2 rounded-xl shadow-sm">💰</span>
                </div>
                <h3 id="statCoins"
                    class="text-2xl sm:text-3xl md:text-4xl font-black text-[#0c4a6e] dark:text-white truncate tracking-tight">
                    0</h3>
                <p class="text-xs font-bold text-[#0369a1] dark:text-[#7dd3fc] mt-1">Total THB</p>
            </div>

            <!-- Widget: รอบทำงาน -->
            <div class="card p-5 md:p-6 bg-[#F3E8FF] dark:bg-[#3B0764] border-[#e9d5ff] dark:border-[#7e22ce]">
                <div class="flex justify-between items-start mb-4">
                    <span
                        class="text-xs md:text-sm font-extrabold uppercase text-[#7e22ce] dark:text-[#c084fc] tracking-wider">Operations</span>
                    <span class="text-2xl bg-white dark:bg-zinc-900 p-2 rounded-xl shadow-sm">⚙️</span>
                </div>
                <h3 id="statJobs"
                    class="text-2xl sm:text-3xl md:text-4xl font-black text-[#3b0764] dark:text-white truncate tracking-tight">
                    0</h3>
                <p class="text-xs font-bold text-[#6b21a8] dark:text-[#d8b4fe] mt-1">Total Cycles</p>
            </div>

            <!-- Widget: ซักผ้า -->
            <div class="card p-5 md:p-6 bg-[#DCFCE7] dark:bg-[#052E16] border-[#bbf7d0] dark:border-[#15803d]">
                <div class="flex justify-between items-start mb-4">
                    <span
                        class="text-xs md:text-sm font-extrabold uppercase text-[#15803d] dark:text-[#4ade80] tracking-wider">Washer</span>
                    <span class="text-2xl bg-white dark:bg-zinc-900 p-2 rounded-xl shadow-sm">🌊</span>
                </div>
                <h3 id="statWasher"
                    class="text-2xl sm:text-3xl md:text-4xl font-black text-[#052e16] dark:text-white truncate tracking-tight">
                    0</h3>
                <p class="text-xs font-bold text-[#166534] dark:text-[#86efac] mt-1">Cycles</p>
            </div>

            <!-- Widget: อบผ้า -->
            <div class="card p-5 md:p-6 bg-[#FFEDD5] dark:bg-[#431407] border-[#fed7aa] dark:border-[#c2410c]">
                <div class="flex justify-between items-start mb-4">
                    <span
                        class="text-xs md:text-sm font-extrabold uppercase text-[#c2410c] dark:text-[#fb923c] tracking-wider">Dryer</span>
                    <span class="text-2xl bg-white dark:bg-zinc-900 p-2 rounded-xl shadow-sm">♨️</span>
                </div>
                <h3 id="statDryer"
                    class="text-2xl sm:text-3xl md:text-4xl font-black text-[#431407] dark:text-white truncate tracking-tight">
                    0</h3>
                <p class="text-xs font-bold text-[#9a3412] dark:text-[#fdba74] mt-1">Cycles</p>
            </div>
        </div>

        <!-- 📈 กราฟแนวโน้ม -->
        <div class="card p-4 md:p-6 animate-fade delay-200">
            <div class="flex items-center gap-3 mb-6">
                <div class="h-8 w-2 bg-zinc-800 dark:bg-white rounded-full"></div>
                <h2 class="text-base md:text-xl font-black text-zinc-800 dark:text-white uppercase tracking-wide">Peak
                    Analytics</h2>
            </div>
            <div class="w-full relative h-[250px] sm:h-[300px] md:h-[350px]">
                <canvas id="peakHoursLineChart"></canvas>
            </div>
        </div>

        <!-- 🍩 Charts Group -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6 animate-fade delay-300">
            <!-- โดนัท -->
            <div class="card p-4 md:p-6 lg:col-span-1 flex flex-col h-full">
                <div class="flex items-center gap-3 mb-6 shrink-0">
                    <div class="h-8 w-2 bg-pink-500 rounded-full"></div>
                    <h2 class="text-base md:text-lg font-black text-zinc-800 dark:text-white uppercase tracking-wide">
                        Ratio</h2>
                </div>
                <div class="flex-1 flex justify-center items-center py-2">
                    <div class="w-full max-w-[180px] sm:max-w-[200px] md:max-w-[240px]"><canvas
                            id="doughnutChart"></canvas></div>
                </div>
            </div>
            <!-- บาร์ชาร์ต -->
            <div class="card p-4 md:p-6 lg:col-span-2 flex flex-col justify-between">
                <div class="flex items-center gap-3 mb-4 shrink-0">
                    <div class="h-8 w-2 bg-blue-500 rounded-full"></div>
                    <h2 class="text-base md:text-lg font-black text-zinc-800 dark:text-white uppercase tracking-wide">
                        Top Devices</h2>
                </div>
                <div class="w-full relative flex-1 min-h-[300px] sm:min-h-[400px]">
                    <canvas id="horizontalBarChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 📋 Data Table (Pill Rows) -->
        <div class="card overflow-hidden animate-fade delay-300 bg-zinc-50 dark:bg-zinc-900/50">
            <div class="p-5 md:p-6 bg-white dark:bg-zinc-900 border-b-2 border-zinc-200 dark:border-zinc-800">
                <div class="flex items-center gap-3">
                    <div class="h-8 w-2 bg-green-500 rounded-full"></div>
                    <h2 class="text-base md:text-lg font-black text-zinc-800 dark:text-white uppercase tracking-wide">
                        Live Feed</h2>
                </div>
            </div>

            <div class="overflow-x-auto max-h-[450px] p-2 md:p-4">
                <table class="w-full text-left relative border-collapse min-w-[500px]">
                    <thead class="sticky top-0 bg-zinc-50 dark:bg-zinc-900/90 backdrop-blur z-10 shadow-sm">
                        <tr
                            class="text-[10px] md:text-xs text-zinc-400 uppercase tracking-widest font-black whitespace-nowrap">
                            <th class="py-4 px-4">Timestamp</th>
                            <th class="py-4 px-4">Device ID</th>
                            <th class="py-4 px-4 text-center">Type</th>
                            <th class="py-4 px-4 text-right">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="font-bold">
                        <!-- JS Content -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script ควบคุม (เหมือนเดิมเป๊ะ) -->
    <script>
        const DB_API_URL = 'https://api.all123th.com/inw/api/wl_transactions/';
        const BRANCH_API_URL = 'https://washing.adokub.com/api/branch';
        let doughnutChartInstance = null; let barChartInstance = null; let lineChartInstance = null;
        let cacheData = { washer: 0, dryer: 0, deviceLabels: [], deviceTotals: [], washerHourly: Array(24).fill(0), dryerHourly: Array(24).fill(0) };

        async function loadBranches() {
            try {
                const res = await fetch(BRANCH_API_URL);
                const branches = await res.json();
                const branchSelect = document.getElementById('branchFilter');
                branchSelect.innerHTML = '';
                branches.forEach(b => {
                    const option = document.createElement('option');
                    option.value = b.serial; option.textContent = b.name;
                    branchSelect.appendChild(option);
                });
                branchSelect.value = 'ladkabung';
            } catch (error) {
                document.getElementById('branchFilter').innerHTML = `<option value="all">รวมทุกสาขา</option><option value="ladkabung" selected>ลาดกระบัง</option>`;
            }
        }

        async function fetchData() {
            const loader = document.getElementById('loading-overlay');
            loader.style.display = 'flex'; loader.style.opacity = '1';
            try {
                const res = await fetch(`${DB_API_URL}?limit=2000`);
                let rawTransactions = await res.json();
                const dates = getDateRange();
                const targetStart = dates.start + " 00:00:00"; const targetEnd = dates.end + " 23:59:59";
                const selectedBranch = document.getElementById('branchFilter').value;

                let filteredTransactions = rawTransactions.filter(t => {
                    if (!t.timestamp) return false;
                    return (t.timestamp >= targetStart && t.timestamp <= targetEnd) && (selectedBranch === 'all' || t.branch === selectedBranch);
                });
                processDataAndRender(filteredTransactions);
            } catch (err) {
                console.error(err);
            } finally {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);
            }
        }

        async function silentFetchData() {
            try {
                const res = await fetch(`${DB_API_URL}?limit=2000`);
                let rawTransactions = await res.json();
                const dates = getDateRange();
                const targetStart = dates.start + " 00:00:00"; const targetEnd = dates.end + " 23:59:59";
                const selectedBranch = document.getElementById('branchFilter').value;
                let filteredTransactions = rawTransactions.filter(t => {
                    if (!t.timestamp) return false;
                    return (t.timestamp >= targetStart && t.timestamp <= targetEnd) && (selectedBranch === 'all' || t.branch === selectedBranch);
                });
                processDataAndRender(filteredTransactions);
            } catch (err) { }
        }

        function processDataAndRender(transactions) {
            let totalIncome = 0; let totalJobs = transactions.length;
            let washerCount = 0; let dryerCount = 0;
            const deviceIncomeMap = {};
            const washerHourly = Array(24).fill(0); const dryerHourly = Array(24).fill(0);

            const tableHtml = transactions.length ? transactions.map((t) => {
                const coins = parseInt(t.coins_paid) || 0;
                const incomeBaht = coins * 10;
                totalIncome += incomeBaht;
                const isDryer = t.machine_type === 'Dryer' || t.device_name.includes('อบ');
                if (isDryer) dryerCount++; else washerCount++;
                if (incomeBaht > 0) deviceIncomeMap[t.device_name] = (deviceIncomeMap[t.device_name] || 0) + incomeBaht;

                const hour = parseInt(t.timestamp.substring(11, 13));
                if (!isNaN(hour) && hour >= 0 && hour < 24) {
                    if (isDryer) dryerHourly[hour] += incomeBaht; else washerHourly[hour] += incomeBaht;
                }

                // สไตล์ปุ่มในตารางแบบกล่องมนๆ
                const badgeClass = isDryer
                    ? 'bg-[#fb923c] text-white border-b-2 border-[#c2410c]'
                    : 'bg-[#38bdf8] text-white border-b-2 border-[#0284c7]';

                return `
                    <tr class="text-xs sm:text-sm hover:bg-white dark:hover:bg-zinc-800 transition-colors">
                        <td class="py-3 px-4 text-zinc-500 whitespace-nowrap">${t.timestamp.substring(0, 16)}</td>
                        <td class="py-3 px-4 text-zinc-800 dark:text-zinc-200 font-extrabold whitespace-nowrap">${t.device_name}</td>
                        <td class="py-3 px-4 text-center whitespace-nowrap"><span class="${badgeClass} px-3 py-1.5 rounded-xl text-[10px] sm:text-xs font-black uppercase tracking-wider whitespace-nowrap">${isDryer ? 'DRY' : 'WASH'}</span></td>
                        <td class="py-3 px-4 text-right font-black text-lg text-zinc-900 dark:text-white whitespace-nowrap">+${incomeBaht}</td>
                    </tr>`;
            }).join('') : `<tr><td colspan="4" class="text-center py-10 text-zinc-400">ไม่มีข้อมูล</td></tr>`;

            document.getElementById('statCoins').innerText = totalIncome.toLocaleString();
            document.getElementById('statJobs').innerText = totalJobs.toLocaleString();
            document.getElementById('statWasher').innerText = washerCount.toLocaleString();
            document.getElementById('statDryer').innerText = dryerCount.toLocaleString();
            document.getElementById('tableBody').innerHTML = tableHtml;

            const sortedDevices = Object.entries(deviceIncomeMap)
                .map(([name, total]) => ({ name, total }))
                .sort((a, b) => {
                    const isAWasher = a.name.includes('ซัก');
                    const isBWasher = b.name.includes('ซัก');
                    if (isAWasher && !isBWasher) return -1;
                    if (!isAWasher && isBWasher) return 1;
                    return parseInt(a.name.match(/\d+$/)?.[0] || 0) - parseInt(b.name.match(/\d+$/)?.[0] || 0);
                });
            cacheData.washer = washerCount; cacheData.dryer = dryerCount;
            cacheData.deviceLabels = sortedDevices.map(d => d.name);
            cacheData.deviceTotals = sortedDevices.map(d => d.total);
            cacheData.washerHourly = washerHourly; cacheData.dryerHourly = dryerHourly;

            updateCharts();
        }

        function checkFilter() {
            const isCustom = document.getElementById('timeFilter').value === 'custom';
            const wrapper = document.getElementById('customDateWrapper');
            wrapper.classList.toggle('hidden', !isCustom);
            wrapper.classList.toggle('flex', isCustom);
            document.getElementById('btnSearchCustom').classList.toggle('hidden', !isCustom);
            if (!isCustom) fetchData();
        }

        function formatThaiDateShort(dateStr) {
            if (!dateStr) return "-";
            const parts = dateStr.split('-');
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${parseInt(parts[2])} ${months[parseInt(parts[1]) - 1]} ${parseInt(parts[0]) + 543}`;
        }

        function getDateRange() {
            const f = document.getElementById('timeFilter').value;
            let startStr = "", endStr = "";
            const formatDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            if (f === 'custom') {
                startStr = document.getElementById('customDateStart').value;
                endStr = document.getElementById('customDateEnd').value;
            } else {
                const t = new Date(), s = new Date();
                if (f === 'weekly') s.setDate(t.getDate() - 7);
                if (f === 'monthly') s.setDate(t.getDate() - 30);
                startStr = formatDate(s); endStr = formatDate(t);
            }
            const displayEl = document.getElementById('dateRangeDisplay');
            if (displayEl) displayEl.innerText = startStr === endStr ? `📅 ${formatThaiDateShort(startStr)}` : `📅 ${formatThaiDateShort(startStr)} - ${formatThaiDateShort(endStr)}`;
            return { start: startStr, end: endStr };
        }

        Chart.defaults.font.family = "'Kanit', sans-serif";

        function updateCharts() {
            const isDark = document.body.classList.contains('dark');
            const textColor = isDark ? '#a1a1aa' : '#52525b';
            const gridColor = isDark ? '#27272a' : '#e4e4e7';

            const isMobile = window.innerWidth < 768;
            const chartFontSize = isMobile ? 10 : 12;

            // สีโทน Neon จัดจ้านตัดกับพื้นหลัง
            const colorW = '#3b82f6'; // Blue
            const colorD = '#f97316'; // Orange

            if (doughnutChartInstance) doughnutChartInstance.destroy();
            doughnutChartInstance = new Chart(document.getElementById('doughnutChart').getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: ['WASH', 'DRY'],
                    datasets: [{
                        data: [cacheData.washer, cacheData.dryer],
                        backgroundColor: [colorW, colorD],
                        borderWidth: 4,
                        borderColor: isDark ? '#18181b' : '#ffffff',
                        hoverOffset: 4
                    }]
                },
                options: { responsive: true, cutout: '75%', plugins: { legend: { position: 'bottom', labels: { color: textColor, padding: 15, usePointStyle: true, font: { size: chartFontSize, weight: 'bold' } } } } }
            });

            if (lineChartInstance) lineChartInstance.destroy();
            const ctxLine = document.getElementById('peakHoursLineChart').getContext('2d');

            lineChartInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0') + ':00'),
                    datasets: [
                        { label: 'WASH', data: cacheData.washerHourly, borderColor: colorW, backgroundColor: 'transparent', tension: 0.4, borderWidth: 4, pointRadius: 0, pointHoverRadius: 6 },
                        { label: 'DRY', data: cacheData.dryerHourly, borderColor: colorD, backgroundColor: 'transparent', tension: 0.4, borderWidth: 4, pointRadius: 0, pointHoverRadius: 6 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { position: 'top', align: 'end', labels: { color: textColor, usePointStyle: true, boxWidth: 6, font: { size: chartFontSize, weight: 'bold' } } } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: textColor, maxRotation: 45, font: { size: chartFontSize, weight: 'bold' } } },
                        y: { grid: { color: gridColor, borderDash: [5, 5] }, ticks: { color: textColor, font: { size: chartFontSize, weight: 'bold' } }, border: { display: false }, beginAtZero: true }
                    }
                }
            });

            if (barChartInstance) barChartInstance.destroy();
            barChartInstance = new Chart(document.getElementById('horizontalBarChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: cacheData.deviceLabels,
                    datasets: [{
                        data: cacheData.deviceTotals,
                        backgroundColor: cacheData.deviceLabels.map(l => l.includes('ซัก') ? colorW : colorD),
                        borderRadius: 8, // มนๆ สไตล์ Bento
                        barThickness: isMobile ? 12 : 20
                    }]
                },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: gridColor, borderDash: [5, 5] }, ticks: { color: textColor, font: { size: chartFontSize, weight: 'bold' } }, border: { display: false } },
                        y: { grid: { display: false }, ticks: { color: textColor, font: { size: chartFontSize, weight: 'bold' } }, border: { display: false } }
                    }
                }
            });
        }

        async function initDashboard() {
            await loadBranches();
            await fetchData();
        }
        initDashboard();

        setInterval(silentFetchData, 5 * 60 * 1000);

        function toggleDarkMode() {
            document.body.classList.toggle('dark');
            document.getElementById('theme-toggle-btn').innerText = document.body.classList.contains('dark') ? '☀️' : '⚡';
            updateCharts();
        }

        window.addEventListener('resize', () => {
            if (doughnutChartInstance && lineChartInstance && barChartInstance) updateCharts();
        });
    </script>
</body>

</html>
