<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wash Lover Dashboard - Glass Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* 🎨 Animated Gradient Background */
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            color: #1e293b;
            transition: color 0.4s ease;
        }

        body.dark {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #0f3460, #312e81);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f1f5f9;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🧊 Glassmorphism Cards */
        .card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        body.dark .card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px 0 rgba(31, 38, 135, 0.2);
        }

        body.dark .card:hover {
            box-shadow: 0 15px 40px 0 rgba(0, 0, 0, 0.6);
        }

        /* 🚀 Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }

        /* 🌀 Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        body.dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.4); }

        /* 💎 Loading Screen Glass */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        body.dark #loading-overlay { background: rgba(15, 23, 42, 0.5); }
        .spinner-logo { 
            width: 90px; 
            animation: popSpin 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; 
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2)); 
        }
        @keyframes popSpin {
            0% { transform: rotate(0deg) scale(0.9); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(0.9); }
        }

        /* 🌟 specific elements for Dark Mode */
        body.dark .text-slate-800 { color: #ffffff; }
        body.dark .text-slate-700 { color: #f1f5f9; }
        body.dark .text-slate-500 { color: #94a3b8; }
        body.dark tr:hover { background-color: rgba(255, 255, 255, 0.05) !important; }
    </style>
</head>

<body class="p-4 md:p-8 relative">

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <img src="https://i.ibb.co/v6F6dNMf/logo-removebg-preview.png" class="spinner-logo" alt="Loading...">
        <p class="mt-6 text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-blue-600 dark:from-pink-400 dark:to-blue-400 animate-pulse drop-shadow-sm">กำลังจัดเตรียมข้อมูล...</p>
    </div>

    <div class="max-w-7xl mx-auto space-y-6 relative z-10">

        <!-- 🏷️ Header & Filter -->
        <div class="card p-4 sm:p-6 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 xl:gap-6 animate-fade-in">
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4 w-full xl:w-auto">
                <h1 class="text-2xl sm:text-3xl font-bold flex items-center gap-2 shrink-0 drop-shadow-sm">
                    <img src="https://i.ibb.co/v6F6dNMf/logo-removebg-preview.png" alt="Logo" class="h-10 sm:h-12 w-auto">

                <!-- Glass Input Select -->

                        <option value="all">กำลังโหลดสาขา...</option>

            <!-- โซนด้านขวา -->
            <div class="flex flex-wrap items-center gap-3 w-full xl:w-auto justify-start xl:justify-end">
                <div id="customDateWrapper" class="hidden flex-col md:flex-row gap-2 items-center w-full md:w-auto">
                    <div class="flex items-center gap-2 bg-white/40 dark:bg-black/20 backdrop-blur-md rounded-xl px-3 py-2 border border-white/30 dark:border-white/10 shadow-sm w-full md:w-auto">
                        <span class="text-xs text-slate-500 dark:text-slate-400 font-bold uppercase shrink-0">จาก</span>
                        <input type="date" id="customDateStart" class="bg-transparent border-none text-slate-800 dark:text-white text-sm focus:outline-none w-full cursor-pointer">
                    </div>
                    <div class="flex items-center gap-2 bg-white/40 dark:bg-black/20 backdrop-blur-md rounded-xl px-3 py-2 border border-white/30 dark:border-white/10 shadow-sm w-full md:w-auto">
                        <span class="text-xs text-slate-500 dark:text-slate-400 font-bold uppercase shrink-0">ถึง</span>
                        <input type="date" id="customDateEnd" class="bg-transparent border-none text-slate-800 dark:text-white text-sm focus:outline-none w-full cursor-pointer">

                <div class="flex gap-2 w-full md:w-auto">

                        <option value="daily">วันนี้</option>
                        <option value="weekly">ย้อนหลัง 7 วัน</option>
                        <option value="monthly">ย้อนหลัง 30 วัน</option>

                    <button id="btnSearchCustom" onclick="fetchData()" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white px-6 py-2.5 rounded-xl hidden hover:shadow-lg hover:shadow-pink-500/40 transform hover:-translate-y-0.5 transition-all font-bold">ค้นหา</button>

        </div>

        <!-- 📊 Stat Cards (Glass Style) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6 animate-fade-in delay-100">
            <!-- ยอดเงินรวม -->
            <div class="card p-5 sm:p-6 flex items-center justify-between gap-2 overflow-hidden relative group border-t border-l border-white/80 dark:border-white/20">

                </div>

            <!-- รอบทำงาน -->
            <div class="card p-5 sm:p-6 flex items-center justify-between gap-2 overflow-hidden relative group border-t border-l border-white/80 dark:border-white/20">
                <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-400/20 rounded-bl-full -z-10 group-hover:scale-125 transition-transform duration-500"></div>
                <div class="z-10">
                    <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 font-bold tracking-wide uppercase opacity-80">รอบทำงานรวม</p>
                    <h3 id="statJobs" class="text-2xl sm:text-3xl font-bold text-indigo-600 dark:text-indigo-400 mt-1 drop-shadow-sm">0</h3>
                </div>
                <div class="p-3 rounded-2xl bg-white/50 dark:bg-black/30 backdrop-blur-md text-indigo-500 dark:text-indigo-400 shadow-sm z-10 border border-white/50 dark:border-white/10">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-7 h-7"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
                </div>
            </div>

            <!-- เครื่องซัก -->
            <div class="card p-5 sm:p-6 flex items-center justify-between gap-2 overflow-hidden relative group border-t border-l border-white/80 dark:border-white/20">
                <div class="absolute top-0 right-0 w-32 h-32 bg-sky-400/20 rounded-bl-full -z-10 group-hover:scale-125 transition-transform duration-500"></div>
                <div class="z-10">
                    <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 font-bold tracking-wide uppercase opacity-80">เครื่องซัก</p>
                    <h3 id="statWasher" class="text-2xl sm:text-3xl font-bold text-sky-600 dark:text-sky-400 mt-1 drop-shadow-sm">0</h3>
                </div>
                <div class="p-3 rounded-2xl bg-white/50 dark:bg-black/30 backdrop-blur-md text-sky-500 dark:text-sky-400 shadow-sm z-10 border border-white/50 dark:border-white/10">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-7 h-7"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-1.605.42-3.113 1.157-4.418" /></svg>

            <!-- เครื่องอบ -->

                <div class="absolute top-0 right-0 w-32 h-32 bg-orange-400/20 rounded-bl-full -z-10 group-hover:scale-125 transition-transform duration-500"></div>
                <div class="z-10">
                    <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 font-bold tracking-wide uppercase opacity-80">เครื่องอบ</p>
                    <h3 id="statDryer" class="text-2xl sm:text-3xl font-bold text-orange-600 dark:text-orange-400 mt-1 drop-shadow-sm">0</h3>

        <!-- 📈 กราฟแนวโน้ม -->
        <div class="card p-6 animate-fade-in delay-200">
            <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2 drop-shadow-sm">
                <span class="text-xl">📊</span> แนวโน้มรายได้สะสม (Peak Hours)
            </h2>
            <div class="w-full relative h-[300px] md:h-[350px]">
                <canvas id="peakHoursLineChart"></canvas>
            </div>

        <!-- 🍩 Charts Row -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fade-in delay-300">
            <div class="card p-6 lg:col-span-1 flex flex-col h-full">
                <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2 shrink-0 drop-shadow-sm">
                    <span class="text-xl">🎯</span> สัดส่วนการใช้งาน
                </h2>
                <div class="flex-1 flex justify-center items-center">
                    <div class="w-full max-w-[200px] md:max-w-[230px]"><canvas id="doughnutChart"></canvas></div>
                </div>
            </div>

            <div class="card p-6 lg:col-span-2 flex flex-col justify-between">
                <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2 drop-shadow-sm">
                    <span class="text-xl">🏆</span> รายได้แยกตามเครื่อง (฿)

                    <canvas id="horizontalBarChart"></canvas>
                </div>
            </div>

        <!-- 📋 Transaction Table -->
        <div class="card p-0 overflow-hidden animate-fade-in delay-300">
            <div class="p-6 border-b border-white/20 dark:border-white/5">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 drop-shadow-sm">
                    <span class="text-xl">🧾</span> ประวัติการทำงานล่าสุด

            </div>
            <div class="overflow-x-auto max-h-[450px] overflow-y-auto px-6 pb-6 pt-2">

                    <thead class="sticky top-0 bg-white/70 dark:bg-slate-900/70 backdrop-blur-md z-10">
                        <tr class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider border-b border-slate-200/50 dark:border-slate-700/50">
                            <th class="pb-3 pt-2 font-bold">วันที่ / เวลา</th>
                            <th class="pb-3 pt-2 font-bold">อุปกรณ์</th>
                            <th class="pb-3 pt-2 font-bold text-center">ประเภท</th>
                            <th class="pb-3 pt-2 font-bold text-right">ยอด (฿)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200/30 dark:divide-slate-700/30">
                        <!-- JS วางข้อมูลที่นี่ -->
                    </tbody>
                </table>
            </div>
        </div>

    <!-- Script ควบคุมการทำงาน -->
    <script>
        const DB_API_URL = 'https://api.all123th.com/inw/api/wl_transactions/';
        const BRANCH_API_URL = 'https://washing.adokub.com/api/branch';

        let doughnutChartInstance = null;
        let barChartInstance = null;
        let lineChartInstance = null;

        let cacheData = {
            washer: 0, dryer: 0, deviceLabels: [], deviceTotals: [],
            washerHourly: Array(24).fill(0), dryerHourly: Array(24).fill(0)
        };

        async function loadBranches() {
            try {
                const res = await fetch(BRANCH_API_URL);
                const branches = await res.json();
                const branchSelect = document.getElementById('branchFilter');
                
                branchSelect.innerHTML = '';
                
                branches.forEach(b => {
                    const option = document.createElement('option');
                    option.value = b.serial;
                    option.textContent = b.name;
                    branchSelect.appendChild(option);
                });
                // Default
                if(branches.find(b => b.serial === 'ladkabung')) {
                    branchSelect.value = 'ladkabung';
                }
            } catch (error) {
                document.getElementById('branchFilter').innerHTML = `<option value="all">รวมทุกสาขา</option><option value="ladkabung" selected>ลาดกระบัง</option>`;
            }
        }

        async function fetchData() {
            const loader = document.getElementById('loading-overlay');
            loader.style.display = 'flex'; loader.style.opacity = '1';
            try {
                const res = await fetch(`${DB_API_URL}?limit=2000`);
                let rawTransactions = await res.json();

                const dates = getDateRange();
                const targetStart = dates.start + " 00:00:00";
                const targetEnd = dates.end + " 23:59:59";
                const selectedBranch = document.getElementById('branchFilter').value;

                let filteredTransactions = rawTransactions.filter(t => {
                    if (!t.timestamp) return false;
                    const isDateMatch = t.timestamp >= targetStart && t.timestamp <= targetEnd;
                    const isBranchMatch = selectedBranch === 'all' || t.branch === selectedBranch;
                    return isDateMatch && isBranchMatch;
                });

                processDataAndRender(filteredTransactions);
            } catch (err) {
                console.error("API Error:", err);
            } finally {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }
        }

        async function silentFetchData() {
            try {
                const res = await fetch(`${DB_API_URL}?limit=2000`);
                let rawTransactions = await res.json();
                const dates = getDateRange();
                const targetStart = dates.start + " 00:00:00";
                const targetEnd = dates.end + " 23:59:59";
                const selectedBranch = document.getElementById('branchFilter').value;

                let filteredTransactions = rawTransactions.filter(t => {
                    if (!t.timestamp) return false;
                    return (t.timestamp >= targetStart && t.timestamp <= targetEnd) && (selectedBranch === 'all' || t.branch === selectedBranch);
                });
                processDataAndRender(filteredTransactions);
            } catch (err) {}
        }

        function processDataAndRender(transactions) {
            let totalIncome = 0, totalJobs = transactions.length;
            let washerCount = 0, dryerCount = 0;
            const deviceIncomeMap = {}, washerHourly = Array(24).fill(0), dryerHourly = Array(24).fill(0);

            const tableHtml = transactions.length ? transactions.map((t) => {
                const coins = parseInt(t.coins_paid) || 0;
                const incomeBaht = coins * 10;
                totalIncome += incomeBaht;
                const isDryer = t.machine_type === 'Dryer' || t.device_name.includes('อบ');
                if (isDryer) dryerCount++; else washerCount++;
                if (incomeBaht > 0) deviceIncomeMap[t.device_name] = (deviceIncomeMap[t.device_name] || 0) + incomeBaht;
                
                const hour = parseInt(t.timestamp.substring(11, 13));
                if (!isNaN(hour) && hour >= 0 && hour < 24) {
                    if (isDryer) dryerHourly[hour] += incomeBaht; else washerHourly[hour] += incomeBaht;
                }

                const badgeClass = isDryer 
                    ? 'bg-orange-500/20 text-orange-600 dark:bg-orange-500/30 dark:text-orange-400 border border-orange-500/30' 
                    : 'bg-sky-500/20 text-sky-600 dark:bg-sky-500/30 dark:text-sky-400 border border-sky-500/30';

                return `
                    <tr class="text-sm transition-colors duration-200">
                        <td class="py-3.5 text-slate-600 dark:text-slate-300 font-medium whitespace-nowrap">${t.timestamp.substring(0, 16)}</td>
                        <td class="py-3.5 font-bold ${isDryer ? 'text-orange-600 dark:text-orange-400' : 'text-sky-600 dark:text-sky-400'}">${t.device_name}</td>
                        <td class="py-3.5 text-center"><span class="${badgeClass} px-3 py-1 rounded-full text-xs font-bold tracking-wide backdrop-blur-sm">${isDryer ? 'อบผ้า' : 'ซักผ้า'}</span></td>
                        <td class="py-3.5 text-right font-bold text-slate-800 text-base drop-shadow-sm">+${incomeBaht} <span class="text-xs opacity-70">฿</span></td>
                    </tr>`;
            }).join('') : `<tr><td colspan="4" class="text-center py-12 text-slate-500/50 dark:text-slate-400/50">
                <span class="block text-4xl mb-3">🔍</span> 
                <p class="font-medium text-lg">ไม่พบข้อมูลในช่วงเวลานี้</p>
            </td></tr>`;

            document.getElementById('statCoins').innerText = totalIncome.toLocaleString() + ' ฿';
            document.getElementById('statJobs').innerText = totalJobs.toLocaleString();
            document.getElementById('statWasher').innerText = washerCount.toLocaleString();
            document.getElementById('statDryer').innerText = dryerCount.toLocaleString();
            document.getElementById('tableBody').innerHTML = tableHtml;

            const sortedDevices = Object.entries(deviceIncomeMap)
                .map(([name, total]) => ({ name, total }))
                .sort((a, b) => {
                    const isAWasher = a.name.includes('ซัก'), isBWasher = b.name.includes('ซัก');
                    if (isAWasher && !isBWasher) return -1;
                    if (!isAWasher && isBWasher) return 1;
                    return parseInt(a.name.match(/\d+$/)?.[0] || 0) - parseInt(b.name.match(/\d+$/)?.[0] || 0);
                });

            cacheData.washer = washerCount; cacheData.dryer = dryerCount;
            cacheData.deviceLabels = sortedDevices.map(d => d.name);
            cacheData.deviceTotals = sortedDevices.map(d => d.total);
            cacheData.washerHourly = washerHourly; cacheData.dryerHourly = dryerHourly;

            updateCharts();
        }

        function checkFilter() {
            const isCustom = document.getElementById('timeFilter').value === 'custom';
            const wrapper = document.getElementById('customDateWrapper');
            wrapper.classList.toggle('hidden', !isCustom);
            wrapper.classList.toggle('flex', isCustom);
            document.getElementById('btnSearchCustom').classList.toggle('hidden', !isCustom);
            if (!isCustom) fetchData();
        }

        function formatThaiDateShort(dateStr) {
            if (!dateStr) return "-";
            const parts = dateStr.split('-');
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${parseInt(parts[2])} ${months[parseInt(parts[1]) - 1]} ${parseInt(parts[0]) + 543}`;
        }

        function getDateRange() {
            const f = document.getElementById('timeFilter').value;
            let startStr = "", endStr = "";
            const formatDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

            if (f === 'custom') {
                startStr = document.getElementById('customDateStart').value;
                endStr = document.getElementById('customDateEnd').value;
            } else {
                const t = new Date(), s = new Date();
                if (f === 'weekly') s.setDate(t.getDate() - 7);
                if (f === 'monthly') s.setDate(t.getDate() - 30);
                startStr = formatDate(s); endStr = formatDate(t);
            }

            const displayEl = document.getElementById('dateRangeDisplay');
            if (displayEl) displayEl.innerText = startStr === endStr ? `📅 ${formatThaiDateShort(startStr)}` : `📅 ${formatThaiDateShort(startStr)} - ${formatThaiDateShort(endStr)}`;
            return { start: startStr, end: endStr };
        }

        Chart.defaults.font.family = "'Kanit', sans-serif";
        Chart.defaults.color = 'rgba(150,150,150,0.8)';

        function updateCharts() {
            const isDark = document.body.classList.contains('dark');
            const textColor = isDark ? '#f1f5f9' : '#1e293b';
            const gridColor = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.05)';

            if (doughnutChartInstance) doughnutChartInstance.destroy();
            doughnutChartInstance = new Chart(document.getElementById('doughnutChart').getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: ['เครื่องซัก', 'เครื่องอบ'],
                    datasets: [{ 
                        data: [cacheData.washer, cacheData.dryer], 
                        backgroundColor: ['rgba(14, 165, 233, 0.8)', 'rgba(249, 115, 22, 0.8)'],
                        borderColor: isDark ? 'rgba(15, 23, 42, 0.5)' : 'rgba(255,255,255,0.5)',
                        borderWidth: 2,
                        hoverOffset: 4
                    }]
                },
                options: { responsive: true, cutout: '70%', plugins: { legend: { position: 'bottom', labels: { color: textColor, padding: 20, usePointStyle: true, font: {weight: 'bold'} } } } }
            });

            if (lineChartInstance) lineChartInstance.destroy();
            const ctxLine = document.getElementById('peakHoursLineChart').getContext('2d');
            let gradW = ctxLine.createLinearGradient(0, 0, 0, 350); gradW.addColorStop(0, 'rgba(14, 165, 233, 0.5)'); gradW.addColorStop(1, 'rgba(14, 165, 233, 0)');
            let gradD = ctxLine.createLinearGradient(0, 0, 0, 350); gradD.addColorStop(0, 'rgba(249, 115, 22, 0.5)'); gradD.addColorStop(1, 'rgba(249, 115, 22, 0)');

            lineChartInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0') + ':00'),
                    datasets: [
                        { label: 'ซักผ้า', data: cacheData.washerHourly, borderColor: '#0ea5e9', backgroundColor: gradW, fill: true, tension: 0.4, borderWidth: 3, pointRadius: 0, pointHoverRadius: 6 },
                        { label: 'อบผ้า', data: cacheData.dryerHourly, borderColor: '#f97316', backgroundColor: gradD, fill: true, tension: 0.4, borderWidth: 3, pointRadius: 0, pointHoverRadius: 6 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { position: 'top', align: 'end', labels: { color: textColor, usePointStyle: true, boxWidth: 8, font: {weight: 'bold'} } } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: textColor, maxRotation: 45, font: {weight: 'bold'} } },
                        y: { grid: { color: gridColor, borderDash: [5, 5] }, ticks: { color: textColor, font: {weight: 'bold'} }, beginAtZero: true }
                    }
                }
            });

            if (barChartInstance) barChartInstance.destroy();
            barChartInstance = new Chart(document.getElementById('horizontalBarChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: cacheData.deviceLabels,
                    datasets: [{
                        data: cacheData.deviceTotals,
                        backgroundColor: cacheData.deviceLabels.map(l => l.includes('ซัก') ? 'rgba(14, 165, 233, 0.8)' : 'rgba(249, 115, 22, 0.8)'),
                        borderColor: isDark ? 'rgba(15, 23, 42, 0.2)' : 'rgba(255,255,255,0.5)',
                        borderWidth: 1,
                        borderRadius: 6,
                        barThickness: 16
                    }]
                },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: gridColor, borderDash: [5, 5] }, ticks: { color: textColor, font: {weight: 'bold'} } },
                        y: { grid: { display: false }, ticks: { color: textColor, font: {weight: 'bold'} } }
                    }
                }
            });
        }

        async function initDashboard() {
            await loadBranches(); 
            await fetchData();    
        }
        initDashboard();
        setInterval(silentFetchData, 5 * 60 * 1000);

        function toggleDarkMode() {
            document.body.classList.toggle('dark');
            document.getElementById('theme-toggle-btn').innerText = document.body.classList.contains('dark') ? '☀️' : '🌙';
            updateCharts();
        }
    </script>
</body>
</html>
